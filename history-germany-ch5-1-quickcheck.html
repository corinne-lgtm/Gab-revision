<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Check – Germany 5.1 How did Hitler become Chancellor?</title>
<style>
:root{
  --bg:#f4eee6; --ink:#1f2a33; --muted:#67737b; --paper:#fffdf7; --line:#dbcfc0;
  --red:#d94b42; --red2:#ffe0dd; --orange:#f29a2e; --orange2:#ffe4bd;
  --blue:#3f6f9a; --blue2:#dfefff; --green:#5e9f6b; --green2:#dff0e2;
  --purple:#7353a6; --purple2:#eadff7; --dark:#1d2935; --yellow:#f4cf55;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(circle at top left,rgba(217,75,66,.12),transparent 34%),
    radial-gradient(circle at top right,rgba(242,154,46,.14),transparent 34%),
    var(--bg);
  font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.4;
}
.wrap{max-width:860px;margin:0 auto;padding:24px}

/* HERO */
.hero{background:linear-gradient(135deg,#2a3644,#7c382f);color:white;border-radius:30px;padding:30px;margin-bottom:22px;box-shadow:0 14px 35px rgba(0,0,0,.18)}
.kicker{font-weight:900;text-transform:uppercase;letter-spacing:2px;color:var(--yellow);font-size:13px;margin-bottom:10px}
.hero h1{font-size:clamp(26px,4vw,46px);line-height:1;letter-spacing:-1px;margin-bottom:10px}
.hero p{font-size:17px;color:rgba(255,255,255,.86)}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.nav a{background:white;color:#26313d;text-decoration:none;font-weight:900;padding:9px 14px;border-radius:999px;font-size:14px}

/* PROGRESS */
.progress-bar-wrap{background:rgba(255,255,255,.3);border-radius:999px;height:10px;margin-top:18px}
.progress-bar{background:var(--yellow);border-radius:999px;height:10px;width:0;transition:width .4s ease}
.progress-label{font-size:13px;color:rgba(255,255,255,.75);margin-top:6px;font-weight:900}

/* SECTIONS */
.section-label{font-weight:900;text-transform:uppercase;letter-spacing:2px;font-size:12px;color:var(--muted);margin:28px 0 10px}

/* QUESTION CARDS */
.q-card{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:20px 22px;margin-bottom:14px;transition:border-color .25s}
.q-card.correct{border-color:#5e9f6b;background:linear-gradient(135deg,var(--green2),var(--paper))}
.q-card.wrong{border-color:#d94b42;background:linear-gradient(135deg,var(--red2),var(--paper))}
.q-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.q-num{background:var(--dark);color:var(--yellow);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex-shrink:0}
.q-text{font-weight:700;font-size:16px;line-height:1.35}
.q-type-badge{margin-left:auto;flex-shrink:0;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;padding:4px 10px;border-radius:999px}
.badge-mc{background:var(--blue2);color:var(--blue)}
.badge-tf{background:var(--purple2);color:var(--purple)}

/* OPTIONS */
.options{display:grid;gap:9px}
.opt{display:flex;align-items:center;gap:12px;background:white;border:2px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer;font-size:15px;font-weight:600;transition:border-color .2s,background .2s;user-select:none}
.opt:hover:not(.disabled){border-color:#aab5bf;background:#f5f5f5}
.opt.correct-pick{border-color:var(--green);background:var(--green2);color:#2a6135}
.opt.wrong-pick{border-color:var(--red);background:var(--red2);color:#7c1f1a}
.opt.missed{border-color:var(--orange);background:var(--orange2);color:#7a4800}
.opt.disabled{cursor:default}
.opt-marker{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:900}
.opt-letter{font-size:12px;font-weight:900;color:var(--muted);width:16px;flex-shrink:0}
.feedback{font-size:13px;font-weight:900;margin-top:10px;padding:8px 12px;border-radius:10px;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--green2);color:#2a6135}
.feedback.ko{background:var(--red2);color:#7c1f1a}

/* RESULT */
.result-box{display:none;background:var(--dark);color:white;border-radius:28px;padding:32px;text-align:center;margin-top:30px;box-shadow:0 14px 40px rgba(0,0,0,.2)}
.result-box.show{display:block}
.result-emoji{font-size:64px;margin-bottom:12px}
.result-score{font-size:clamp(40px,8vw,72px);font-weight:900;color:var(--yellow);line-height:1}
.result-label{font-size:18px;color:rgba(255,255,255,.8);margin:8px 0 16px}
.result-msg{font-size:22px;font-weight:900;color:white;line-height:1.3}
.result-sub{font-size:15px;color:rgba(255,255,255,.65);margin-top:10px}
.btn-retry{margin-top:22px;background:var(--yellow);color:var(--dark);font-weight:900;font-size:16px;border:none;padding:14px 36px;border-radius:999px;cursor:pointer}

@media(max-width:600px){.wrap{padding:14px}.nav a{font-size:13px;padding:8px 12px}.q-type-badge{display:none}}
@media print{.nav,.result-box button{display:none}}
</style>
</head>
<body>
<div class="wrap">

<section class="hero">
  <div class="kicker">AQA GCSE History · Germany 1890–1945 · Quick Check</div>
  <h1>5.1 How did Hitler become Chancellor?</h1>
  <p>20 questions — 10 multiple choice + 10 true/false. Answer every question to see your score.</p>
  <div class="nav">
    <a href="index.html">🏠 Main hub</a>
    <a href="history-index.html">📚 History index</a>
    <a href="history-germany-ch5-index.html">📂 Chapter 5</a>
    <a href="history-germany-ch5-1-revision.html">📖 Revision notes</a>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="progress-label" id="progressLabel">0 of 20 answered</div>
</section>

<div class="section-label">Part 1 — Multiple Choice</div>
<div id="quizContainer"></div>
<div class="result-box" id="resultBox">
  <div class="result-emoji" id="resultEmoji"></div>
  <div class="result-score" id="resultScore"></div>
  <div class="result-label">out of 20</div>
  <div class="result-msg" id="resultMsg"></div>
  <div class="result-sub" id="resultSub"></div>
  <button class="btn-retry" onclick="location.reload()">🔄 Try again</button>
</div>

</div>

<script>
const questions = [
  // ── MULTIPLE CHOICE (10) ──
  {
    type:"mc",
    q:"Why were coalition governments common in Weimar Germany?",
    options:["There were only three political parties","It was required by Article 48","There were about 30 parties, making a majority very hard to win","The President always appointed coalition governments"],
    answer:2
  },
  {
    type:"mc",
    q:"What did Article 48 of the Weimar Constitution allow the President to do?",
    options:["Dissolve the SA","Rule without the Reichstag using emergency powers","Call an election at any time","Appoint Hitler directly as Chancellor"],
    answer:1
  },
  {
    type:"mc",
    q:"How many seats did the Nazis win in the September 1930 Reichstag election?",
    options:["68","77","107","143"],
    answer:2
  },
  {
    type:"mc",
    q:"Which party had the most seats after the September 1930 election?",
    options:["The Nazis","The KPD","The Centre Party","The SPD"],
    answer:3
  },
  {
    type:"mc",
    q:"What was the SA's role in helping the Nazis build support?",
    options:["They organised mass rallies and flag parades","They disrupted opponents' meetings and fought Communists","They wrote propaganda for newspapers","They negotiated with Hindenburg directly"],
    answer:1
  },
  {
    type:"mc",
    q:"How many seats did the Nazis win in the July 1932 Reichstag election?",
    options:["107","143","196","230"],
    answer:3
  },
  {
    type:"mc",
    q:"What happened to Nazi support between July 1932 and November 1932?",
    options:["It rose to 280 seats","It stayed exactly the same","It fell slightly to 196 seats","It collapsed to below 100 seats"],
    answer:2
  },
  {
    type:"mc",
    q:"Why did Hindenburg initially refuse to make Hitler Chancellor after July 1932?",
    options:["The Nazis had not won the election","He disliked the Nazis and thought they were violent","Von Papen had already been appointed Chancellor","Article 48 prevented it"],
    answer:1
  },
  {
    type:"mc",
    q:"Who persuaded Hindenburg to appoint Hitler as Chancellor in January 1933?",
    options:["Gregor Strasser","Von Schleicher","Von Papen","Brüning"],
    answer:2
  },
  {
    type:"mc",
    q:"Why did von Papen and Hindenburg agree to make Hitler Chancellor?",
    options:["The Nazis had finally won a majority in the Reichstag","They believed they could control Hitler","Hitler had promised to end the SA's violence","The army demanded it"],
    answer:1
  },

  // ── TRUE / FALSE (10) ──
  {
    type:"tf",
    q:"The Nazis won a majority of seats in the Reichstag before Hitler became Chancellor.",
    options:["True","False"],
    answer:1
  },
  {
    type:"tf",
    q:"Chancellor Brüning was unpopular because he reduced unemployment pay and raised taxes during the Depression.",
    options:["True","False"],
    answer:0
  },
  {
    type:"tf",
    q:"The Reichsbanner was a paramilitary group that supported the Nazi Party.",
    options:["True","False"],
    answer:1
  },
  {
    type:"tf",
    q:"After the July 1932 election, the Nazis were the largest party in the Reichstag.",
    options:["True","False"],
    answer:0
  },
  {
    type:"tf",
    q:"Street fighting between political groups helped make Weimar Germany look stable and well-governed.",
    options:["True","False"],
    answer:1
  },
  {
    type:"tf",
    q:"Hitler became Chancellor on 30 January 1933.",
    options:["True","False"],
    answer:0
  },
  {
    type:"tf",
    q:"The Great Depression caused unemployment to rise to about 3 million by the time of the 1930 election.",
    options:["True","False"],
    answer:0
  },
  {
    type:"tf",
    q:"Hindenburg used Article 48 to immediately appoint Hitler Chancellor without any political deal.",
    options:["True","False"],
    answer:1
  },
  {
    type:"tf",
    q:"The KPD won 77 seats in the September 1930 election.",
    options:["True","False"],
    answer:0
  },
  {
    type:"tf",
    q:"Von Papen's plan to control Hitler after appointing him Chancellor was ultimately successful.",
    options:["True","False"],
    answer:1
  }
];

let answered = 0;
const total = questions.length;

function buildQuiz(){
  const container = document.getElementById('quizContainer');
  let mcLabel = false, tfLabel = false;

  questions.forEach((q, qi) => {
    // Insert T/F section label
    if(q.type === "tf" && !tfLabel){
      tfLabel = true;
      const lbl = document.createElement('div');
      lbl.className = 'section-label';
      lbl.textContent = 'Part 2 — True or False';
      container.appendChild(lbl);
    }

    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'q'+qi;

    const badge = q.type === 'mc'
      ? '<span class="q-type-badge badge-mc">Multiple choice</span>'
      : '<span class="q-type-badge badge-tf">True / False</span>';

    const optLetters = ['A','B','C','D'];
    let optsHTML = '';
    q.options.forEach((opt, oi) => {
      const letter = q.type === 'mc' ? `<span class="opt-letter">${optLetters[oi]}</span>` : '';
      optsHTML += `<div class="opt" id="q${qi}o${oi}" onclick="pick(${qi},${oi})">
        ${letter}
        <span style="flex:1">${opt}</span>
        <span class="opt-marker" id="q${qi}m${oi}"></span>
      </div>`;
    });

    card.innerHTML = `
      <div class="q-header">
        <div class="q-num">${qi+1}</div>
        <div class="q-text">${q.q}</div>
        ${badge}
      </div>
      <div class="options">${optsHTML}</div>
      <div class="feedback" id="q${qi}fb"></div>`;
    container.appendChild(card);
  });
}

function pick(qi, oi){
  const q = questions[qi];
  const card = document.getElementById('q'+qi);
  if(card.dataset.done) return; // already answered
  card.dataset.done = '1';

  const correct = oi === q.answer;

  // Style each option
  q.options.forEach((_,i) => {
    const el = document.getElementById(`q${qi}o${i}`);
    const marker = document.getElementById(`q${qi}m${i}`);
    el.classList.add('disabled');
    if(i === q.answer && i === oi){
      el.classList.add('correct-pick');
      marker.textContent = '✓';
    } else if(i === oi && i !== q.answer){
      el.classList.add('wrong-pick');
      marker.textContent = '✗';
    } else if(i === q.answer && i !== oi){
      el.classList.add('missed');
      marker.textContent = '✓';
    }
  });

  // Card colour
  card.classList.add(correct ? 'correct' : 'wrong');

  // Feedback
  const fb = document.getElementById(`q${qi}fb`);
  fb.className = 'feedback show ' + (correct ? 'ok' : 'ko');
  fb.textContent = correct ? '✅ Correct!' : `❌ Not quite — the correct answer was: "${q.options[q.answer]}"`;

  answered++;
  updateProgress();
  if(answered === total) showResult();
}

function updateProgress(){
  const pct = (answered/total)*100;
  document.getElementById('progressBar').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = `${answered} of ${total} answered`;
}

function showResult(){
  let score = 0;
  questions.forEach((q,qi) => {
    const card = document.getElementById('q'+qi);
    if(card.classList.contains('correct')) score++;
  });

  let emoji, msg, sub;
  if(score >= 18){
    emoji = '🏆'; msg = `Show this to mum — ${score}/20`; sub = "Outstanding! You really know this topic. Keep it up!";
  } else if(score >= 14){
    emoji = '👍'; msg = `Show this to mum — ${score}/20`; sub = "Good work! A bit more revision and you'll nail the exam.";
  } else {
    emoji = '📖'; msg = `Show this to mum — ${score}/20`; sub = "Keep going — read over the revision notes and try again!";
  }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultScore').textContent = score;
  document.getElementById('resultMsg').textContent = msg;
  document.getElementById('resultSub').textContent = sub;
  const box = document.getElementById('resultBox');
  box.classList.add('show');
  box.scrollIntoView({behavior:'smooth',block:'start'});
}

buildQuiz();
</script>
</body>
</html>
