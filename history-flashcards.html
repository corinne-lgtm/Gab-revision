let filtered = [];
let current = 0;

const topicFilter = document.getElementById('topicFilter');
const levelFilter = document.getElementById('levelFilter');
const cardContainer = document.getElementById('cardContainer');
const countPill = document.getElementById('countPill');
const positionPill = document.getElementById('positionPill');

function initTopics(){
  const topics = ['All chapters', ...new Set(flashcards.map(c => c.topic))];
  topicFilter.innerHTML = topics.map(t => `<option value="${t}">${t}</option>`).join('');
}

function applyFilters(){
  const topic = topicFilter.value;
  const level = levelFilter.value;
  filtered = flashcards.filter(c => 
    (topic === 'All chapters' || c.topic === topic) &&
    (level === 'All' || c.level === level)
  );
  current = 0;
  renderCard();
}

function renderCard(){
  countPill.textContent = `${filtered.length} cards`;
  if(filtered.length === 0){
    positionPill.textContent = 'Card 0 / 0';
    cardContainer.innerHTML = '<div class="empty">No cards for this filter.</div>';
    return;
  }
  const c = filtered[current];
  positionPill.textContent = `Card ${current + 1} / ${filtered.length}`;
  cardContainer.innerHTML = `
    <div class="card-area">
      <div class="flashcard" onclick="this.classList.toggle('flipped')">
        <div class="face front-face">
          <div>
            <div class="meta">
              <span class="tag topic">${c.topic}</span>
              <span class="tag level">${c.level}</span>
            </div>
            <div class="question">${c.q}</div>
          </div>
          <div class="hint">Click to reveal answer</div>
        </div>
        <div class="face back-face">
          <div>
            <div class="meta">
              <span class="tag topic">Answer</span>
              <span class="tag level">${c.level}</span>
            </div>
            <div class="answer">${c.a}</div>
          </div>
          <div class="hint">Click again to hide</div>
        </div>
      </div>
    </div>`;
}

function nextCard(){
  if(filtered.length === 0) return;
  current = (current + 1) % filtered.length;
  renderCard();
}

function prevCard(){
  if(filtered.length === 0) return;
  current = (current - 1 + filtered.length) % filtered.length;
  renderCard();
}

function shuffleCards(){
  for(let i = filtered.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
  }
  current = 0;
  renderCard();
}

topicFilter.addEventListener('change', applyFilters);
levelFilter.addEventListener('change', applyFilters);

initTopics();
applyFilters();
