<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biology – B6.1 Vaccination · Quick Check</title>
<style>
:root{--bg:#f0f7ee;--ink:#1a2e1a;--muted:#5a7a5a;--paper:#f9fdf7;--line:#c8dfc8;--green:#3a7d44;--green2:#d4edda;--lime:#7ab648;--lime2:#e8f5d8;--blue:#2e6b8a;--blue2:#d4eaf5;--orange:#e07b2a;--orange2:#fde8cc;--red:#c0392b;--red2:#fde8e6;--purple:#6b4a9a;--purple2:#e8daf5;--dark:#1a2e1a;--yellow:#c8e040}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at top left,rgba(58,125,68,.1),transparent 34%),radial-gradient(circle at top right,rgba(122,182,72,.12),transparent 34%),var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.4;min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:24px}

/* HERO */
.hero{background:linear-gradient(135deg,#1a2e1a,#3a7d44);color:white;border-radius:30px;padding:30px;margin-bottom:22px;box-shadow:0 14px 35px rgba(0,0,0,.18)}
.kicker{font-weight:900;text-transform:uppercase;letter-spacing:2px;color:#c8e040;font-size:13px;margin-bottom:10px}
h1{font-size:clamp(26px,5vw,48px);line-height:1;letter-spacing:-1px}
.hero p{font-size:16px;color:rgba(255,255,255,.8);margin-top:8px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.nav a{background:white;color:#1a2e1a;text-decoration:none;font-weight:900;padding:9px 14px;border-radius:999px;font-size:14px}

/* PREV SCORE BANNER */
#prev-banner{display:none;background:var(--orange2);border:2px solid var(--orange);border-radius:16px;padding:12px 16px;margin-bottom:18px;font-weight:700;font-size:14px;color:#7a3800}

/* PROGRESS */
.progress-bar-wrap{background:var(--line);border-radius:999px;height:10px;margin-bottom:22px;overflow:hidden}
.progress-bar{background:var(--yellow);height:100%;width:0%;transition:width .3s;border-radius:999px}

/* QUESTION BLOCKS */
.q-block{background:rgba(255,255,255,.85);border:2px solid var(--line);border-radius:24px;padding:22px;margin-bottom:18px;display:none}
.q-block.active{display:block}
.q-label{font-weight:900;text-transform:uppercase;font-size:11px;letter-spacing:1.5px;color:var(--muted);margin-bottom:8px}
.q-text{font-size:17px;font-weight:700;margin-bottom:16px}
.options{display:grid;gap:10px}
.opt-btn{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 16px;text-align:left;cursor:pointer;font-size:15px;font-family:inherit;color:var(--ink);transition:border-color .15s,background .15s}
.opt-btn:hover:not(:disabled){border-color:var(--green);background:var(--green2)}
.opt-btn.correct{background:var(--green2);border-color:var(--green);font-weight:700}
.opt-btn.wrong{background:var(--red2);border-color:var(--red)}
.opt-btn:disabled{cursor:default}
/* TF */
.tf-row{display:flex;gap:12px}
.tf-btn{flex:1;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-size:16px;font-weight:900;font-family:inherit;color:var(--ink);transition:border-color .15s,background .15s}
.tf-btn:hover:not(:disabled){border-color:var(--green);background:var(--green2)}
.tf-btn.correct{background:var(--green2);border-color:var(--green)}
.tf-btn.wrong{background:var(--red2);border-color:var(--red)}
.tf-btn:disabled{cursor:default}

/* FEEDBACK */
.feedback{display:none;margin-top:14px;border-radius:12px;padding:11px 14px;font-size:14px;font-weight:700}
.feedback.ok{background:var(--green2);color:#1a4d22;border:1.5px solid #a8d4b0}
.feedback.bad{background:var(--red2);color:#7a1a14;border:1.5px solid #e8a0a0}

/* NEXT */
.next-btn{display:none;margin-top:14px;background:var(--dark);color:white;border:none;border-radius:999px;padding:11px 24px;font-weight:900;font-size:15px;cursor:pointer;font-family:inherit}
.next-btn:hover{background:var(--green)}

/* RESULT BOX */
#result-box{display:none;background:rgba(255,255,255,.92);border:2px solid var(--line);border-radius:28px;padding:30px;text-align:center;margin-top:24px}
#result-box .trophy{font-size:64px;margin-bottom:12px}
#result-box h2{font-size:32px;margin-bottom:8px;letter-spacing:-.5px}
#result-box .score-big{font-size:52px;font-weight:900;color:var(--green);line-height:1;margin:8px 0}
#result-box .show-mum{background:var(--yellow);color:var(--dark);border-radius:16px;padding:10px 18px;font-weight:900;font-size:15px;display:inline-block;margin:14px 0}
#result-box p{color:var(--muted);font-size:15px;max-width:480px;margin:0 auto}
.reset-btn{margin-top:20px;background:var(--dark);color:white;border:none;border-radius:999px;padding:12px 28px;font-weight:900;font-size:15px;cursor:pointer;font-family:inherit}
.reset-btn:hover{background:var(--green)}

@media(max-width:600px){.wrap{padding:14px}.tf-row{flex-direction:column}}
@media print{.nav{display:none}}
</style>
</head>
<body>
<div class="wrap">

<section class="hero">
  <div class="kicker">AQA GCSE Biology · B6.1 Vaccination</div>
  <h1>Quick Check ⚡</h1>
  <p>20 questions — multiple choice + true/false. How well do you know vaccination?</p>
  <div class="nav">
    <a href="index.html">🏠 Main hub</a>
    <a href="biology-index.html">📚 Biology</a>
    <a href="biology-b6-1-revision.html">📖 Revision</a>
  </div>
</section>

<div id="prev-banner"></div>

<div class="progress-bar-wrap"><div class="progress-bar" id="prog"></div></div>

<div id="quiz-area"></div>
<div id="result-box"></div>

</div>
<script>
const SCORE_KEY = 'biology-b6-1-score';
const DATE_KEY  = 'biology-b6-1-date';
const TOTAL = 20;

// ── QUESTIONS ──────────────────────────────────────────────────────────────
const MCQ = [
  {
    q: "What are antigens?",
    opts: [
      "Proteins on the surface of cells that the immune system uses to recognise foreign invaders",
      "Antibodies produced by white blood cells to destroy pathogens",
      "White blood cells that remember past infections",
      "Dead or inactive pathogens injected during vaccination"
    ],
    ans: 0
  },
  {
    q: "Which cells produce antibodies?",
    opts: ["Red blood cells","White blood cells","Platelets","Nerve cells"],
    ans: 1
  },
  {
    q: "Why does each pathogen need a unique antibody?",
    opts: [
      "Because each pathogen has a different antigen shape that the antibody must match",
      "Because antibodies are made of different materials each time",
      "Because pathogens destroy all old antibodies on entry",
      "Because white blood cells only produce one antibody in a lifetime"
    ],
    ans: 0
  },
  {
    q: "What is the role of memory cells?",
    opts: [
      "To produce antigens when a pathogen enters the body",
      "To destroy red blood cells infected with pathogens",
      "To remember the correct antibody so it can be made rapidly if the pathogen returns",
      "To carry oxygen around the body during infection"
    ],
    ans: 2
  },
  {
    q: "What is introduced into the body during vaccination?",
    opts: [
      "Live, active pathogens that cause mild illness",
      "A small amount of dead or inactive pathogen",
      "Ready-made antibodies from a donor",
      "Memory cells from an immune person"
    ],
    ans: 1
  },
  {
    q: "Which of the following is a VIRAL disease that can be prevented by vaccination?",
    opts: ["Tetanus","Diphtheria","Measles (MMR)","Salmonella"],
    ans: 2
  },
  {
    q: "Which of the following is a BACTERIAL disease that can be prevented by vaccination?",
    opts: ["Polio","Influenza","Measles","Tetanus"],
    ans: 3
  },
  {
    q: "Which disease has been completely wiped out worldwide by vaccination?",
    opts: ["Polio","Measles","Smallpox","Whooping cough"],
    ans: 2
  },
  {
    q: "What percentage vaccination coverage does the WHO say is needed for measles herd immunity?",
    opts: ["70%","80%","90%","95%"],
    ans: 3
  },
  {
    q: "What happened in the UK in the 1970s when vaccination rates for whooping cough dropped to ~30%?",
    opts: [
      "The disease was eradicated within a year",
      "Thousands of children caught whooping cough and some died",
      "Herd immunity was maintained because enough adults were immune",
      "A new antibiotic was developed to treat it instead"
    ],
    ans: 1
  }
];

const TF = [
  { q: "Immunity means having a constantly high level of antibodies in the blood at all times.", ans: false },
  { q: "Memory cells allow the body to produce the correct antibodies more quickly if a pathogen returns.", ans: true },
  { q: "Vaccines only work against viral diseases — they cannot protect against bacterial diseases.", ans: false },
  { q: "When a vaccine is given, the person usually becomes ill with the disease being vaccinated against.", ans: false },
  { q: "Herd immunity means that even people who are not vaccinated can be protected if enough of the population is immune.", ans: true },
  { q: "The antigen on a pathogen is the same as the antigens on your own body's cells.", ans: false },
  { q: "Antibodies produced by white blood cells are specific — each antibody targets one particular antigen.", ans: true },
  { q: "Smallpox has been completely eliminated from the world thanks to a global vaccination programme.", ans: true },
  { q: "If vaccination rates fall below the herd immunity threshold, a disease can return and spread rapidly.", ans: true },
  { q: "During vaccination, the dead or inactive pathogen causes a full infection so the body learns to fight it.", ans: false }
];

// ── BUILD QUESTION LIST ────────────────────────────────────────────────────
const questions = [];
MCQ.forEach((q,i) => questions.push({type:'mcq',id:i,...q}));
TF.forEach((q,i)  => questions.push({type:'tf', id:i,...q}));

let current = 0, score = 0;
const answers = new Array(TOTAL).fill(null);

// ── PREV SCORE BANNER ──────────────────────────────────────────────────────
(function(){
  const s = localStorage.getItem(SCORE_KEY);
  const d = localStorage.getItem(DATE_KEY);
  if(s !== null && d){
    const banner = document.getElementById('prev-banner');
    banner.style.display = 'block';
    banner.textContent = `⏱ Last attempt: ${s}/${TOTAL} — ${d}`;
  }
})();

// ── RENDER ─────────────────────────────────────────────────────────────────
function render(){
  const area = document.getElementById('quiz-area');
  area.innerHTML = '';
  questions.forEach((q,i) => {
    const div = document.createElement('div');
    div.className = 'q-block' + (i===0 ? ' active' : '');
    div.id = 'q'+i;
    if(q.type==='mcq'){
      div.innerHTML = `
        <div class="q-label">Question ${i+1} of ${TOTAL} · Multiple choice</div>
        <div class="q-text">${q.q}</div>
        <div class="options">
          ${q.opts.map((o,oi)=>`<button class="opt-btn" onclick="answerMCQ(${i},${oi})">${o}</button>`).join('')}
        </div>
        <div class="feedback" id="fb${i}"></div>
        <button class="next-btn" id="nx${i}" onclick="next(${i})">${i===TOTAL-1?'See results →':'Next →'}</button>`;
    } else {
      div.innerHTML = `
        <div class="q-label">Question ${i+1} of ${TOTAL} · True or False</div>
        <div class="q-text">${q.q}</div>
        <div class="tf-row">
          <button class="tf-btn" onclick="answerTF(${i},true)">✅ True</button>
          <button class="tf-btn" onclick="answerTF(${i},false)">❌ False</button>
        </div>
        <div class="feedback" id="fb${i}"></div>
        <button class="next-btn" id="nx${i}" onclick="next(${i})">${i===TOTAL-1?'See results →':'Next →'}</button>`;
    }
    area.appendChild(div);
  });
  updateProg();
}

// ── ANSWER MCQ ─────────────────────────────────────────────────────────────
function answerMCQ(qi, chosen){
  if(answers[qi]!==null) return;
  answers[qi] = chosen;
  const q = questions[qi];
  const btns = document.querySelectorAll(`#q${qi} .opt-btn`);
  btns.forEach(b => b.disabled = true);
  btns[q.ans].classList.add('correct');
  const fb = document.getElementById('fb'+qi);
  fb.style.display = 'block';
  if(chosen === q.ans){
    score++;
    fb.className = 'feedback ok';
    fb.textContent = '✅ Correct!';
    btns[chosen].classList.add('correct');
  } else {
    fb.className = 'feedback bad';
    fb.textContent = `❌ Not quite — the correct answer is highlighted in green.`;
    btns[chosen].classList.add('wrong');
  }
  document.getElementById('nx'+qi).style.display = 'inline-block';
}

// ── ANSWER TF ──────────────────────────────────────────────────────────────
function answerTF(qi, chosen){
  if(answers[qi]!==null) return;
  answers[qi] = chosen;
  const q = questions[qi];
  const btns = document.querySelectorAll(`#q${qi} .tf-btn`);
  btns.forEach(b => b.disabled = true);
  const fb = document.getElementById('fb'+qi);
  fb.style.display = 'block';
  const correctIdx = q.ans ? 0 : 1;
  btns[correctIdx].classList.add('correct');
  if(chosen === q.ans){
    score++;
    fb.className = 'feedback ok';
    fb.textContent = '✅ Correct!';
  } else {
    fb.className = 'feedback bad';
    fb.textContent = `❌ Not quite — the correct answer is ${q.ans ? 'True' : 'False'}.`;
    btns[chosen ? 0 : 1].classList.add('wrong');
  }
  document.getElementById('nx'+qi).style.display = 'inline-block';
}

// ── NEXT ───────────────────────────────────────────────────────────────────
function next(qi){
  document.getElementById('q'+qi).classList.remove('active');
  current = qi + 1;
  if(current < TOTAL){
    document.getElementById('q'+current).classList.add('active');
    updateProg();
    window.scrollTo({top:0,behavior:'smooth'});
  } else {
    showResult();
  }
}

// ── PROGRESS ───────────────────────────────────────────────────────────────
function updateProg(){
  document.getElementById('prog').style.width = (current/TOTAL*100)+'%';
}

// ── RESULT ─────────────────────────────────────────────────────────────────
function showResult(){
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('prog').style.width = '100%';
  const box = document.getElementById('result-box');
  box.style.display = 'block';

  // Save to localStorage
  const today = new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  localStorage.setItem(SCORE_KEY, score);
  localStorage.setItem(DATE_KEY, today);

  let trophy, heading, msg;
  if(score >= 18){
    trophy = '🏆';
    heading = 'Outstanding!';
    msg = "You've nailed B6.1 — brilliant work on vaccination and the immune system!";
  } else if(score >= 14){
    trophy = '👍';
    heading = 'Good effort!';
    msg = "Solid understanding — go back over any questions you missed and you'll be flying.";
  } else {
    trophy = '📖';
    heading = 'Keep revising!';
    msg = "Head back to the revision page, focus on the key steps of vaccination, and try again.";
  }

  box.innerHTML = `
    <div class="trophy">${trophy}</div>
    <h2>${heading}</h2>
    <div class="score-big">${score}<span style="font-size:28px;color:var(--muted)">/${TOTAL}</span></div>
    <div class="show-mum">📣 Show this to mum — ${score}/${TOTAL}</div>
    <p>${msg}</p>
    <br>
    <button class="reset-btn" onclick="resetQuiz()">🔄 Try again</button>
  `;
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── RESET ──────────────────────────────────────────────────────────────────
function resetQuiz(){
  current = 0; score = 0; answers.fill(null);
  document.getElementById('result-box').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── INIT ───────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
