<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biology – B9.3 Quick Check</title>
<style>
:root{--bg:#f0f7ee;--ink:#1a2e1a;--muted:#5a7a5a;--paper:#f9fdf7;--line:#c8dfc8;--green:#3a7d44;--green2:#d4edda;--lime:#7ab648;--lime2:#e8f5d8;--blue:#2e6b8a;--blue2:#d4eaf5;--orange:#e07b2a;--orange2:#fde8cc;--purple:#6b4a9a;--purple2:#e8daf5;--dark:#1a2e1a;--yellow:#c8e040;--red:#c0392b;--red2:#fde8e6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at top left,rgba(58,125,68,.1),transparent 34%),radial-gradient(circle at top right,rgba(122,182,72,.12),transparent 34%),var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.4;min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:24px}
.hero{background:linear-gradient(135deg,#1a2e1a,#3a7d44);color:white;border-radius:30px;padding:28px 30px 24px;margin-bottom:18px;box-shadow:0 14px 35px rgba(0,0,0,.18)}
.kicker{font-weight:900;text-transform:uppercase;letter-spacing:2px;color:#c8e040;font-size:13px;margin-bottom:8px}
h1{font-size:clamp(24px,5vw,44px);line-height:1;letter-spacing:-1px}
.hero p{font-size:15px;color:rgba(255,255,255,.75);margin-top:6px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.nav a{background:white;color:#1a2e1a;text-decoration:none;font-weight:900;padding:8px 14px;border-radius:999px;font-size:13px}

/* prev score banner */
#prev-banner{display:none;background:var(--orange2);border:2px solid var(--orange);border-radius:16px;padding:12px 16px;margin-bottom:16px;font-size:14px;font-weight:700;color:#7a3a00}

/* progress */
.prog-wrap{background:var(--line);border-radius:999px;height:10px;margin-bottom:20px;overflow:hidden}
.prog-bar{height:10px;border-radius:999px;background:var(--yellow);transition:width .4s}

/* q-block */
.q-block{background:rgba(255,255,255,.85);border:2px solid var(--line);border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.q-num{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px}
.q-text{font-size:16px;font-weight:700;margin-bottom:14px}
.options{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer;font-size:14px;text-align:left;font-family:inherit;color:var(--ink);transition:border-color .15s,background .15s;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--green);background:var(--green2)}
.opt.correct{background:var(--green2);border-color:var(--green);color:#1a4d22}
.opt.wrong{background:var(--red2);border-color:var(--red);color:#7a0000}
.opt:disabled{cursor:default}
.tf-row{display:flex;gap:10px}
.tf-row .opt{flex:1;text-align:center}
.feedback{margin-top:12px;padding:11px 14px;border-radius:12px;font-size:14px;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--green2);border:2px solid var(--green);color:#1a4d22}
.feedback.bad{background:var(--red2);border:2px solid var(--red);color:#7a0000}

/* result box */
#result{display:none;background:rgba(255,255,255,.9);border:2px solid var(--line);border-radius:28px;padding:28px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.08)}
#result .trophy{font-size:64px;margin-bottom:10px}
#result h2{font-size:32px;letter-spacing:-1px;margin-bottom:6px}
#result .score-big{font-size:54px;font-weight:900;color:var(--green);line-height:1;margin:8px 0}
#result .mum{background:var(--dark);color:var(--yellow);border-radius:16px;padding:12px 18px;font-weight:900;font-size:15px;margin:14px 0}
#result p{color:var(--muted);font-size:14px;margin-bottom:16px}
#reset-btn{background:var(--dark);color:white;border:none;padding:13px 28px;border-radius:999px;font-weight:900;font-size:15px;cursor:pointer;font-family:inherit}
#reset-btn:hover{background:var(--green)}
</style>
</head>
<body>
<div class="wrap">

<section class="hero">
  <div class="kicker">AQA GCSE Biology · B9 Respiration</div>
  <h1>B9.3 Quick Check ⚡</h1>
  <p>Anaerobic respiration · 20 questions · See how much you know!</p>
  <div class="nav">
    <a href="index.html">🏠 Main hub</a>
    <a href="biology-index.html">📚 Biology</a>
    <a href="biology-b9-3-revision.html">📖 Revision</a>
  </div>
</section>

<div id="prev-banner"></div>

<div class="prog-wrap"><div class="prog-bar" id="prog" style="width:0%"></div></div>

<div id="quiz-area"></div>

<div id="result">
  <div class="trophy" id="res-trophy">🏆</div>
  <h2 id="res-title">Well done!</h2>
  <div class="score-big" id="res-score"></div>
  <div class="mum" id="res-mum"></div>
  <p id="res-msg"></p>
  <button id="reset-btn" onclick="resetQuiz()">Try again</button>
</div>

</div>
<script>
const SCORE_KEY='biology-b9-3-score';
const DATE_KEY='biology-b9-3-date';
const TOTAL=20;

// Show previous score banner
(function(){
  var s=localStorage.getItem(SCORE_KEY);
  var d=localStorage.getItem(DATE_KEY);
  if(s!==null&&d){
    var el=document.getElementById('prev-banner');
    el.style.display='block';
    el.textContent='📊 Last attempt: '+s+'/'+TOTAL+' — '+d;
  }
})();

const MCQ=[
  {
    q:"What are the products of anaerobic respiration in animals?",
    opts:["Carbon dioxide and water","Lactic acid only","Ethanol and carbon dioxide","Glucose and oxygen"],
    ans:1
  },
  {
    q:"What are the products of anaerobic respiration in yeast?",
    opts:["Lactic acid and water","Carbon dioxide and water","Ethanol and carbon dioxide","Glucose and lactic acid"],
    ans:2
  },
  {
    q:"Why does anaerobic respiration transfer less energy than aerobic respiration?",
    opts:["It occurs in the mitochondria","Glucose is incompletely broken down","It requires more oxygen","It produces more carbon dioxide"],
    ans:1
  },
  {
    q:"Where does anaerobic respiration take place in the cell?",
    opts:["Mitochondria only","Nucleus","Cytoplasm","Cell membrane"],
    ans:2
  },
  {
    q:"What causes muscle fatigue during hard exercise?",
    opts:["Lack of glucose","Build-up of carbon dioxide","Build-up of lactic acid","Decrease in body temperature"],
    ans:2
  },
  {
    q:"What is meant by 'oxygen debt'?",
    opts:["The amount of oxygen breathed in during exercise","The oxygen stored in muscles","The amount of oxygen needed after exercise to break down accumulated lactic acid","The difference in oxygen between inhaled and exhaled air"],
    ans:2
  },
  {
    q:"In the liver, how is lactic acid removed after exercise?",
    opts:["It is excreted in urine","It is converted back to glucose using oxygen","It is broken down into ethanol","It evaporates through sweat"],
    ans:1
  },
  {
    q:"Which of the following uses anaerobic respiration in yeast to make bread rise?",
    opts:["Lactic acid causing dough to expand","Ethanol evaporating and lifting the dough","Carbon dioxide gas getting trapped in the dough","Oxygen being released by fermentation"],
    ans:2
  },
  {
    q:"Which organisms produce lactic acid during anaerobic respiration?",
    opts:["Yeast and plants","Animals and some bacteria","Plants only","Yeast only"],
    ans:1
  },
  {
    q:"Why does a fitter person recover more quickly after exercise?",
    opts:["They produce more lactic acid","Their heart and lungs are more efficient at supplying oxygen","They switch to aerobic respiration more slowly","They have more glucose stored in muscles"],
    ans:1
  }
];

const TF=[
  {q:"Anaerobic respiration requires oxygen to occur.",ans:false},
  {q:"Yeast uses anaerobic respiration (fermentation) to produce ethanol.",ans:true},
  {q:"Aerobic respiration results in complete breakdown of glucose.",ans:true},
  {q:"Lactic acid is the product of anaerobic respiration in plants.",ans:false},
  {q:"After vigorous exercise, breathing rate stays elevated to supply extra oxygen to pay off the oxygen debt.",ans:true},
  {q:"Anaerobic respiration in animals takes place in the mitochondria.",ans:false},
  {q:"The word equation for anaerobic respiration in animals is: glucose → lactic acid.",ans:true},
  {q:"Some bacteria use anaerobic respiration to produce lactic acid, which is used to make yoghurt.",ans:true},
  {q:"Aerobic and anaerobic respiration both transfer the same amount of energy from glucose.",ans:false},
  {q:"Plants can respire anaerobically in waterlogged conditions, producing ethanol and carbon dioxide.",ans:true}
];

let answers=new Array(TOTAL).fill(null);
let locked=new Array(TOTAL).fill(false);

function buildQuiz(){
  const area=document.getElementById('quiz-area');
  area.innerHTML='';
  // MCQ
  MCQ.forEach(function(q,i){
    area.appendChild(makeBlock(i,'MCQ',q));
  });
  // TF
  TF.forEach(function(q,i){
    area.appendChild(makeBlock(10+i,'TF',q));
  });
}

function makeBlock(idx,type,data){
  var div=document.createElement('div');
  div.className='q-block';
  div.id='qb'+idx;
  var num=document.createElement('div');
  num.className='q-num';
  num.textContent='Question '+(idx+1)+' of '+TOTAL+(type==='TF'?' · True / False':'');
  div.appendChild(num);
  var qt=document.createElement('div');
  qt.className='q-text';
  qt.textContent=data.q;
  div.appendChild(qt);
  var opts=document.createElement('div');
  opts.className='options'+(type==='TF'?' tf-row':'');
  if(type==='MCQ'){
    data.opts.forEach(function(o,oi){
      var btn=document.createElement('button');
      btn.className='opt';
      btn.textContent=o;
      btn.onclick=function(){pick(idx,oi,data.ans,div,btn);};
      opts.appendChild(btn);
    });
  } else {
    [true,false].forEach(function(val){
      var btn=document.createElement('button');
      btn.className='opt';
      btn.textContent=val?'True':'False';
      btn.onclick=function(){pickTF(idx,val,data.ans,div,btn);};
      opts.appendChild(btn);
    });
  }
  div.appendChild(opts);
  var fb=document.createElement('div');
  fb.className='feedback';
  fb.id='fb'+idx;
  div.appendChild(fb);
  return div;
}

function pick(idx,chosen,correct,block,btn){
  if(locked[idx])return;
  locked[idx]=true;
  answers[idx]=chosen===correct?1:0;
  var btns=block.querySelectorAll('.opt');
  btns.forEach(function(b,bi){
    b.disabled=true;
    if(bi===correct)b.classList.add('correct');
    else if(bi===chosen)b.classList.add('wrong');
  });
  showFeedback(idx,chosen===correct,null);
  updateProgress();
  checkDone();
}

function pickTF(idx,chosen,correct,block,btn){
  if(locked[idx])return;
  locked[idx]=true;
  answers[idx]=chosen===correct?1:0;
  var btns=block.querySelectorAll('.opt');
  btns.forEach(function(b){
    b.disabled=true;
    var bval=b.textContent==='True';
    if(bval===correct)b.classList.add('correct');
    else if(bval===chosen)b.classList.add('wrong');
  });
  showFeedback(idx,chosen===correct,null);
  updateProgress();
  checkDone();
}

function showFeedback(idx,correct,msg){
  var fb=document.getElementById('fb'+idx);
  fb.className='feedback show '+(correct?'ok':'bad');
  fb.textContent=correct?'✅ Correct!':'❌ Not quite — check your revision notes.';
}

function updateProgress(){
  var done=locked.filter(Boolean).length;
  document.getElementById('prog').style.width=(done/TOTAL*100)+'%';
}

function checkDone(){
  if(locked.every(Boolean)){
    setTimeout(showResult,600);
  }
}

function showResult(){
  var score=answers.reduce(function(a,b){return a+(b||0);},0);
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('prog').style.width='100%';
  var res=document.getElementById('result');
  res.style.display='block';
  document.getElementById('res-score').textContent=score+'/'+TOTAL;
  var trophy,title,msg;
  if(score>=18){
    trophy='🏆';title='Outstanding!';
    msg='You have mastered anaerobic respiration. Brilliant work!';
  } else if(score>=14){
    trophy='👍';title='Good effort!';
    msg='Solid understanding — revisit any questions you missed and you\'ll ace it.';
  } else {
    trophy='📖';title='Keep revising!';
    msg='Go back through the revision notes and try again — you\'ve got this!';
  }
  document.getElementById('res-trophy').textContent=trophy;
  document.getElementById('res-title').textContent=title;
  document.getElementById('res-msg').textContent=msg;
  document.getElementById('res-mum').textContent='Show this to mum — '+score+'/'+TOTAL;
  // Save to localStorage
  var now=new Date();
  var dateStr=now.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  localStorage.setItem(SCORE_KEY,score);
  localStorage.setItem(DATE_KEY,dateStr);
}

function resetQuiz(){
  answers=new Array(TOTAL).fill(null);
  locked=new Array(TOTAL).fill(false);
  document.getElementById('result').style.display='none';
  document.getElementById('quiz-area').style.display='block';
  document.getElementById('prog').style.width='0%';
  buildQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}

buildQuiz();
</script>
</body>
</html>
