<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biology – B4.5 Quick Check</title>
<style>
:root{--bg:#f0f7ee;--ink:#1a2e1a;--muted:#5a7a5a;--paper:#f9fdf7;--line:#c8dfc8;--green:#3a7d44;--green2:#d4edda;--lime:#7ab648;--lime2:#e8f5d8;--blue:#2e6b8a;--blue2:#d4eaf5;--orange:#e07b2a;--orange2:#fde8cc;--red:#c0392b;--red2:#fde8e6;--dark:#1a2e1a;--yellow:#c8e040}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at top left,rgba(58,125,68,.12),transparent 35%),radial-gradient(circle at bottom right,rgba(122,182,72,.1),transparent 35%),var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.4;min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:24px}

/* HERO */
.hero{background:linear-gradient(135deg,#1a2e1a,#3a7d44);color:white;border-radius:30px;padding:30px;margin-bottom:20px;box-shadow:0 14px 35px rgba(0,0,0,.18)}
.kicker{font-weight:900;text-transform:uppercase;letter-spacing:2px;color:#c8e040;font-size:13px;margin-bottom:10px}
h1{font-size:clamp(22px,4vw,40px);line-height:1.05;letter-spacing:-1px}
.hero p{font-size:16px;color:rgba(255,255,255,.8);margin-top:8px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.nav a{background:white;color:#1a2e1a;text-decoration:none;font-weight:900;padding:9px 14px;border-radius:999px;font-size:14px}

/* PREV SCORE BANNER */
#prev-banner{display:none;background:var(--orange2);border:2px solid var(--orange);border-radius:16px;padding:12px 16px;margin-bottom:16px;font-size:14px;font-weight:700;color:#7a3a00}

/* PROGRESS */
#progress-wrap{background:rgba(255,255,255,.5);border-radius:999px;height:10px;margin-bottom:20px;overflow:hidden}
#progress-bar{height:100%;background:var(--yellow);border-radius:999px;width:0%;transition:width .35s ease}

/* Q BLOCKS */
.q-block{background:rgba(255,255,255,.85);border:2px solid var(--line);border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.q-num{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px}
.q-text{font-size:17px;font-weight:700;margin-bottom:14px}
.options{display:flex;flex-direction:column;gap:9px}
.opt{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 16px;cursor:pointer;font-size:15px;font-weight:600;text-align:left;transition:border-color .15s,background .15s;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--green);background:var(--green2)}
.opt.correct{background:#d4edda;border-color:#3a7d44;color:#1a4d22}
.opt.wrong{background:var(--red2);border-color:var(--red);color:#7a1a14}
.opt:disabled{cursor:default}
.tf-row{display:flex;gap:12px}
.tf-row .opt{flex:1;text-align:center}
.feedback{margin-top:12px;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:700;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--green2);color:#1a4d22;border:2px solid #a8d4b0}
.feedback.bad{background:var(--red2);color:#7a1a14;border:2px solid #e0a8a0}

/* SUBMIT */
#submit-btn{display:block;width:100%;padding:16px;background:linear-gradient(135deg,#1a2e1a,#3a7d44);color:white;border:none;border-radius:20px;font-size:18px;font-weight:900;cursor:pointer;margin:24px 0;font-family:inherit;letter-spacing:.5px;box-shadow:0 8px 24px rgba(58,125,68,.3)}
#submit-btn:disabled{opacity:.5;cursor:default}

/* RESULT BOX */
#result-box{display:none;background:linear-gradient(135deg,#1a2e1a,#3a7d44);color:white;border-radius:28px;padding:32px;text-align:center;margin-bottom:24px;box-shadow:0 16px 40px rgba(0,0,0,.2)}
#result-emoji{font-size:64px;margin-bottom:12px}
#result-score{font-size:48px;font-weight:900;color:var(--yellow);letter-spacing:-2px}
#result-label{font-size:18px;color:rgba(255,255,255,.85);margin:6px 0 16px}
#result-msg{background:rgba(255,255,255,.12);border-radius:16px;padding:14px;font-size:15px;font-weight:700;margin-bottom:18px;color:white}
#reset-btn{background:var(--yellow);color:#1a2e1a;border:none;padding:14px 28px;border-radius:999px;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">

<section class="hero">
  <div class="kicker">AQA GCSE Biology · B4 Organising animals and plants</div>
  <h1>B4.5 Breathing &amp; gas exchange ⚡ Quick Check</h1>
  <p>20 questions · See how much you know!</p>
  <div class="nav">
    <a href="index.html">🏠 Main hub</a>
    <a href="biology-index.html">📚 Biology</a>
    <a href="biology-b4-5-revision.html">📖 Revision</a>
  </div>
</section>

<div id="prev-banner"></div>

<div id="progress-wrap"><div id="progress-bar"></div></div>

<div id="quiz-area"></div>

<button id="submit-btn" onclick="submitQuiz()">Submit answers ✓</button>

<div id="result-box">
  <div id="result-emoji"></div>
  <div id="result-score"></div>
  <div id="result-label"></div>
  <div id="result-msg"></div>
  <button id="reset-btn" onclick="resetQuiz()">Try again 🔄</button>
</div>

</div>

<script>
const SCORE_KEY = 'biology-b4-5-score';
const DATE_KEY  = 'biology-b4-5-date';
const TOTAL = 20;

const MCQ = [
  {
    q: "Which structure carries air from the mouth/nose down to the lungs?",
    opts: ["Bronchus","Trachea","Bronchiole","Oesophagus"],
    ans: 1
  },
  {
    q: "What do the rings of cartilage in the trachea do?",
    opts: ["Produce mucus to trap bacteria","Keep the airway open and prevent it collapsing","Filter dust particles from the air","Warm the incoming air"],
    ans: 1
  },
  {
    q: "Where does gas exchange take place in the lungs?",
    opts: ["Bronchi","Trachea","Bronchioles","Alveoli"],
    ans: 3
  },
  {
    q: "What happens to the diaphragm when you breathe IN?",
    opts: ["It domes upwards","It relaxes and domes upwards","It contracts and flattens downwards","It stays still"],
    ans: 2
  },
  {
    q: "When the intercostal muscles contract during inhalation, the ribs move…",
    opts: ["Down and in","Up and out","Side to side","They don't move"],
    ans: 1
  },
  {
    q: "Approximately what percentage of exhaled air is oxygen?",
    opts: ["0%","4%","16%","20%"],
    ans: 2
  },
  {
    q: "Approximately what percentage of exhaled air is carbon dioxide?",
    opts: ["0.04%","4%","16%","20%"],
    ans: 1
  },
  {
    q: "Which alveolus adaptation MOST directly reduces the diffusion distance?",
    opts: ["Large surface area","Rich capillary network","One-cell-thick walls","Ventilation"],
    ans: 2
  },
  {
    q: "Why does ventilation help maintain efficient gas exchange?",
    opts: ["It produces oxygen inside the lung","It keeps concentration gradients steep by replacing stale air","It thickens the alveolus wall","It increases blood pressure"],
    ans: 1
  },
  {
    q: "During exhalation, what happens to pressure inside the chest?",
    opts: ["It decreases below atmospheric pressure","It stays the same","It increases above atmospheric pressure","It becomes zero"],
    ans: 2
  }
];

const TF = [
  { q: "The trachea splits into two bronchi — one going to each lung.", ans: true },
  { q: "Bronchioles are larger tubes than bronchi.", ans: false },
  { q: "The diaphragm is a sheet of muscle that separates the chest from the abdomen.", ans: true },
  { q: "Exhaled air contains no oxygen at all.", ans: false },
  { q: "Nitrogen makes up about 80% of both inhaled and exhaled air.", ans: true },
  { q: "Each alveolus is surrounded by a dense network of capillaries.", ans: true },
  { q: "Air flows from low pressure to high pressure.", ans: false },
  { q: "Alveoli have walls that are only one cell thick.", ans: true },
  { q: "When you breathe out, the volume of the chest cavity decreases.", ans: true },
  { q: "The millions of alveoli together provide a very small total surface area.", ans: false }
];

// build questions array: 10 MCQ then 10 TF
const questions = [
  ...MCQ.map((q,i) => ({...q, type:'mcq', idx:i})),
  ...TF.map((q,i) => ({...q, type:'tf', idx:i+10}))
];

function buildQuiz() {
  const area = document.getElementById('quiz-area');
  area.innerHTML = '';
  questions.forEach((q, i) => {
    const block = document.createElement('div');
    block.className = 'q-block';
    block.id = 'qblock-'+i;
    let optsHTML = '';
    if (q.type === 'mcq') {
      optsHTML = `<div class="options">` +
        q.opts.map((o, oi) =>
          `<button class="opt" data-q="${i}" data-v="${oi}" onclick="pick(this,${i},${oi})">${o}</button>`
        ).join('') +
        `</div>`;
    } else {
      optsHTML = `<div class="options tf-row">
        <button class="opt" data-q="${i}" data-v="true" onclick="pick(this,${i},'true')">✅ True</button>
        <button class="opt" data-q="${i}" data-v="false" onclick="pick(this,${i},'false')">❌ False</button>
      </div>`;
    }
    block.innerHTML = `
      <div class="q-num">Question ${i+1} of ${TOTAL}</div>
      <div class="q-text">${q.q}</div>
      ${optsHTML}
      <div class="feedback" id="fb-${i}"></div>
    `;
    area.appendChild(block);
  });
  updateProgress();
}

const answers = {};

function pick(btn, qi, val) {
  // already answered
  if (answers[qi] !== undefined) return;
  answers[qi] = val;

  const q = questions[qi];
  const correct = q.type === 'mcq' ? q.ans : q.ans;
  const userCorrect = q.type === 'mcq'
    ? parseInt(val) === correct
    : (val === 'true') === correct;

  // disable all opts in this block
  const block = document.getElementById('qblock-'+qi);
  block.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    const bv = b.getAttribute('data-v');
    if (q.type === 'mcq') {
      if (parseInt(bv) === correct) b.classList.add('correct');
      else if (bv === String(val)) b.classList.add('wrong');
    } else {
      const bBool = bv === 'true';
      if (bBool === correct) b.classList.add('correct');
      else if (bv === String(val)) b.classList.add('wrong');
    }
  });

  const fb = document.getElementById('fb-'+qi);
  if (userCorrect) {
    fb.textContent = '✅ Correct!';
    fb.className = 'feedback show ok';
  } else {
    let correctText = '';
    if (q.type === 'mcq') correctText = q.opts[correct];
    else correctText = correct ? 'True' : 'False';
    fb.textContent = '❌ Incorrect — correct answer: ' + correctText;
    fb.className = 'feedback show bad';
  }

  updateProgress();
}

function updateProgress() {
  const done = Object.keys(answers).length;
  document.getElementById('progress-bar').style.width = (done/TOTAL*100)+'%';
}

function submitQuiz() {
  let score = 0;
  questions.forEach((q, i) => {
    if (answers[i] === undefined) return;
    const correct = q.type === 'mcq'
      ? parseInt(answers[i]) === q.ans
      : (answers[i] === 'true') === q.ans;
    if (correct) score++;
  });

  // save to localStorage
  localStorage.setItem(SCORE_KEY, score);
  localStorage.setItem(DATE_KEY, new Date().toLocaleDateString('en-GB'));

  document.getElementById('submit-btn').disabled = true;
  // disable any remaining
  document.querySelectorAll('.opt').forEach(b => { b.disabled = true; });

  // show result
  const box = document.getElementById('result-box');
  box.style.display = 'block';
  document.getElementById('result-score').textContent = score + '/' + TOTAL;

  let emoji, label, msg;
  if (score >= 18) {
    emoji = '🏆'; label = 'Outstanding!';
    msg = 'Show this to mum — ' + score + '/20 🌟';
  } else if (score >= 14) {
    emoji = '👍'; label = 'Good effort!';
    msg = 'Show this to mum — ' + score + '/20. Review the questions you missed!';
  } else {
    emoji = '📖'; label = 'Keep revising!';
    msg = 'Show this to mum — ' + score + '/20. Head back to the revision notes!';
  }
  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-label').textContent = label;
  document.getElementById('result-msg').textContent = msg;

  box.scrollIntoView({behavior:'smooth'});
}

function resetQuiz() {
  Object.keys(answers).forEach(k => delete answers[k]);
  document.getElementById('result-box').style.display = 'none';
  document.getElementById('submit-btn').disabled = false;
  buildQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}

// Show prev score banner
(function(){
  const s = localStorage.getItem(SCORE_KEY);
  const d = localStorage.getItem(DATE_KEY);
  if (s !== null && d) {
    const banner = document.getElementById('prev-banner');
    banner.style.display = 'block';
    banner.textContent = '🕐 Last attempt: ' + s + '/' + TOTAL + ' on ' + d;
  }
})();

buildQuiz();
</script>
</body>
</html>
