<script>
const STORE='gabPaper1PracticeV1';
const Q=[
{id:'01',title:'Cells and cell structures',marks:7,skill:'Recall + cell structure',
prompt:`<b>01.1</b> Match animal, plant and bacterial cells to the correct drawings from the book.<br><br><b>01.2</b> Choose the correct cell structure for each description: contains chromosomes; controls what enters and leaves a cell; site of aerobic respiration; site of photosynthesis.`,
guide:'For each structure, think about its function first. Do not confuse the cell membrane with the cell wall.'},
{id:'02',title:'Bacterial cell division',marks:4,skill:'Recall + calculation',
prompt:`Some bacteria can divide every 20 minutes in optimum conditions.<br><br><b>02.1</b> Name the type of cell division in bacterial cells. [1]<br><b>02.2</b> Give two factors that affect the rate of bacterial cell division. [2]<br><b>02.3</b> If the mean division time is 20 minutes, calculate how many divisions occur in 7 hours. [1]`,
guide:'For the calculation, convert hours to minutes before dividing by the mean division time.'},
{id:'03',title:'Root hair cells and transport',marks:4,skill:'Application',
prompt:`A root hair cell absorbs water and mineral ions from soil.<br><br><b>03.1</b> Describe one adaptation of a root hair cell for absorbing substances. [1]<br><b>03.2</b> State whether water molecules, magnesium ions and nitrate ions move into the root hair cell by active transport, diffusion or osmosis. [3]`,
guide:'Ask: is it water crossing a partially permeable membrane, movement down a concentration gradient, or movement against a gradient using energy?'},
{id:'04',title:'Gonorrhoea and antibiotic resistance',marks:3,skill:'Communicable disease',
prompt:`Some strains of the pathogen that causes gonorrhoea are resistant to antibiotics.<br><br><b>04.1</b> What type of pathogen causes gonorrhoea? [1]<br><b>04.2</b> Give one other way to reduce the spread of gonorrhoea. [1]<br><b>04.3</b> Suggest one way to reduce the rate at which antibiotic-resistant strains develop. [1]`,
guide:'Keep each answer specific. For resistance, think about reducing unnecessary selection pressure from antibiotics.'},
{id:'05',title:'Protease investigation',marks:11,skill:'Required-practical thinking + data',
prompt:`A student investigates protease digestion of egg-white protein using four tubes at 37 °C. Tube A contains egg white + protease + hydrochloric acid; B egg white + protease + water; C egg white + boiled protease + hydrochloric acid; D egg white + water + hydrochloric acid. A and B eventually become clear; C and D remain cloudy.<br><br><b>05.1</b> Give two variables that should be controlled. [2]<br><b>05.2</b> Explain why a tube turns from cloudy to clear when the protein is digested. [3]<br><b>05.3</b> Analyse the results and explain each tube. [6]`,
guide:'Compare one variable at a time. Refer to enzyme activity, pH, denaturation and the control tubes.'},
{id:'06',title:'Drug testing and cholesterol treatments',marks:10,skill:'Evaluation',
prompt:`<b>06.1</b> What is a drug tested on in laboratory trials before clinical trials on people? [1]<br><b>06.2</b> Give three reasons drugs must be trialled before use on patients. [3]<br><br>Statins reduce cholesterol production in the liver but may cause side effects. Cholesterol blockers reduce absorption of cholesterol from the intestine and may interact with other drugs.<br><b>06.3</b> Evaluate the use of the two types of drug for a person with high cholesterol. [6]`,
guide:'For an evaluation, give advantages and disadvantages of both options, then make a reasoned judgement. For drug trials, think efficacy, toxicity and dose.'},
{id:'07',title:'Exercise and respiration',marks:8,skill:'Explain',
prompt:`An athlete's heart rate rises from 67 bpm at rest to 138 bpm while jogging. After running faster, the athlete remains out of breath for several minutes after stopping.<br><br><b>07.1</b> Explain why heart rate needs to increase when jogging. [4]<br><b>07.2</b> Explain why the athlete remains out of breath after stopping. [4]`,
guide:'Build a chain of reasoning: muscles → respiration → oxygen/glucose demand and carbon dioxide removal. For recovery, include anaerobic respiration and lactic acid/oxygen debt.'},
{id:'08',title:'Photosynthesis investigation',marks:17,skill:'Practical + graph interpretation',
prompt:`Students measure photosynthesis in pondweed by counting bubbles per minute at different lamp distances while monitoring temperature.<br><br><b>08.1</b> Complete the word equation for photosynthesis. [2]<br><b>08.2</b> Explain why a thermometer is important. [3]<br><b>08.3</b> At 40 cm the four bubble counts are 30, 10, 9 and 11. Calculate the correct mean. [2]<br><b>08.4</b> Describe how you would plot the results on a graph. [4]<br><b>08.5</b> Does the data support the claim that photosynthesis rate is inversely proportional to lamp distance? Explain. [2]<br><b>08.6</b> A greenhouse receives >30,000 lux daylight. Suggest why 20 °C, 0.1% CO₂ and no extra lighting could be commercially sensible. [4]`,
guide:'Use data where possible. Distinguish correlation from an exact inverse relationship. For the greenhouse question, consider limiting factors and cost.'},
{id:'09',title:'Osmosis in potato tissue',marks:12,skill:'Calculation + graph + osmosis',
prompt:`Potato pieces are weighed, placed for one hour in sugar solutions, blotted and reweighed. Results include: 0.2 mol dm⁻³: 8.3 g → 8.5 g (+2.4%); 0.4: 8.3 g → 8.2 g; 0.6: 8.2 g → 8.0 g (−2.4%); 0.8: 8.1 g → 7.8 g (−3.7%); 1.0: 8.3 g → 7.9 g (−4.8%).<br><br><b>09.1</b> Why blot each potato piece before weighing? [1]<br><b>09.2</b> Calculate the percentage change for 0.4 mol dm⁻³. [2]<br><b>09.3</b> Plot percentage change in mass against sugar concentration and draw a line of best fit. [5]<br><b>09.4</b> Use the graph to estimate the concentration of sugar solution inside the potato cells. [1]<br><b>09.5</b> Explain why this concentration is chosen. [3]`,
guide:'Percentage change = (final − initial) ÷ initial × 100. The internal concentration is estimated where percentage mass change is zero.'}
];

 box.innerHTML=Q.map(q=>`<article class="exam-card ${s[q.id]?.submitted?'locked':''}" id="q${q.id}">
 <div class="exam-head"><div><span class="kicker">Question ${q.id}</span><h2>${q.title}</h2><div class="skill">${q.skill}</div></div><span class="marks">${q.marks} marks</span></div>
 <div class="sourcebox">${q.prompt}</div>
 <div class="guidance"><b>Writing guidance</b><br>${q.guide}</div>
 <textarea class="answerbox" id="a${q.id}" ${s[q.id]?.submitted?'disabled':''} placeholder="Write your exam answer here...">${s[q.id]?.answer||''}</textarea>
 <div class="row" style="margin-top:12px"><button class="btn bio" onclick="submitQ('${q.id}')" ${s[q.id]?.submitted?'disabled':''}>Submit answer</button>
 <button class="btn" onclick="newAttempt('${q.id}')">New attempt</button></div>
 ${s[q.id]?.submitted?'<p class="feedback good">Answer submitted and locked. It is saved on this device.</p>':''}
 </article>`).join('');
 updateProgress();
}
function submitQ(id){let s=load(),a=document.getElementById('a'+id).value.trim();if(!a){alert('Write an answer first.');return}s[id]={answer:a,submitted:true,submittedAt:new Date().toISOString()};save(s);render()}
function newAttempt(id){let s=load();s[id]={answer:'',submitted:false};save(s);render();document.getElementById('q'+id).scrollIntoView({behavior:'smooth'})}
function updateProgress(){let s=load(),n=Q.filter(q=>s[q.id]?.submitted).length;document.getElementById('progressText').textContent=`${n} / ${Q.length} question groups completed`;document.getElementById('bar').style.width=(100*n/Q.length)+'%'}
render();
</script>
</body></html>
