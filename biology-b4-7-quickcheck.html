<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biology – B4.7 Quick Check</title>
<style>
:root{--bg:#f0f7ee;--ink:#1a2e1a;--muted:#5a7a5a;--paper:#f9fdf7;--line:#c8dfc8;--green:#3a7d44;--green2:#d4edda;--lime:#7ab648;--lime2:#e8f5d8;--blue:#2e6b8a;--blue2:#d4eaf5;--orange:#e07b2a;--orange2:#fde8cc;--purple:#6b4a9a;--purple2:#e8daf5;--dark:#1a2e1a;--yellow:#c8e040;--red:#c0392b;--red2:#fde8e6}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top left,rgba(58,125,68,.1),transparent 34%),radial-gradient(circle at top right,rgba(122,182,72,.12),transparent 34%),var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.4}
.wrap{max-width:860px;margin:0 auto;padding:24px}
.hero{background:linear-gradient(135deg,#1a2e1a,#3a7d44);color:white;border-radius:30px;padding:30px;margin-bottom:22px;box-shadow:0 14px 35px rgba(0,0,0,.18)}
.kicker{font-weight:900;text-transform:uppercase;letter-spacing:2px;color:#c8e040;font-size:13px;margin-bottom:10px}
h1{font-size:clamp(22px,4vw,40px);line-height:1;margin:0;letter-spacing:-1px}
.hero p{font-size:16px;color:rgba(255,255,255,.8);max-width:680px;margin-top:8px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.nav a{background:white;color:#1a2e1a;text-decoration:none;font-weight:900;padding:9px 14px;border-radius:999px;font-size:14px}

/* Prev score banner */
#prev-banner{display:none;background:var(--orange2);border:2px solid var(--orange);border-radius:18px;padding:12px 18px;margin-bottom:16px;font-size:14px;font-weight:700;color:#7a3a00}

/* Progress */
.progress-wrap{background:rgba(0,0,0,.1);border-radius:999px;height:10px;margin-bottom:20px;overflow:hidden}
.progress-bar{height:10px;border-radius:999px;background:var(--yellow);transition:width .4s ease;width:0%}

/* Score bar */
.score-bar{background:var(--dark);color:white;border-radius:18px;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-weight:900;font-size:15px}
.score-bar span{color:var(--yellow)}

/* Question block */
.q-block{background:rgba(255,255,255,.85);border:2px solid var(--line);border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.q-num{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
.q-text{font-size:17px;font-weight:700;margin-bottom:14px}
.options{display:flex;flex-direction:column;gap:8px}
.opt-btn{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:11px 16px;font-size:15px;font-family:inherit;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.opt-btn:hover:not(:disabled){border-color:var(--green);background:var(--green2)}
.opt-btn.correct{background:var(--green2)!important;border-color:var(--green)!important;color:#1a4d22}
.opt-btn.wrong{background:var(--red2)!important;border-color:var(--red)!important;color:#7a0000}
.opt-btn:disabled{cursor:default}
/* TF */
.tf-wrap{display:flex;gap:10px}
.tf-btn{flex:1;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--paper);font-size:16px;font-weight:900;font-family:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.tf-btn:hover:not(:disabled){border-color:var(--green);background:var(--green2)}
.tf-btn.correct{background:var(--green2)!important;border-color:var(--green)!important}
.tf-btn.wrong{background:var(--red2)!important;border-color:var(--red)!important}
.tf-btn:disabled{cursor:default}
/* Feedback */
.feedback{margin-top:10px;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:700;display:none}
.feedback.correct{background:var(--green2);color:#1a4d22;display:block}
.feedback.wrong{background:var(--red2);color:#7a0000;display:block}

/* Result box */
#result-box{display:none;background:rgba(255,255,255,.92);border:3px solid var(--green);border-radius:30px;padding:32px;text-align:center;margin-top:24px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
#result-box h2{font-size:clamp(24px,5vw,48px);margin:0 0 8px}
#result-box .sub{font-size:18px;color:var(--muted);margin-bottom:14px}
#result-box .mum{background:var(--dark);color:var(--yellow);border-radius:16px;padding:14px 20px;font-size:18px;font-weight:900;margin:16px 0}
.reset-btn{background:linear-gradient(135deg,#1a2e1a,#3a7d44);color:white;border:none;border-radius:999px;padding:13px 30px;font-size:16px;font-weight:900;font-family:inherit;cursor:pointer;margin-top:10px}

@media(max-width:600px){.wrap{padding:14px}.q-text{font-size:15px}.opt-btn{font-size:14px}}
@media print{.nav{display:none}}
</style>
</head>
<body>
<div class="wrap">

<section class="hero">
  <div class="kicker">AQA GCSE Biology · B4 Organising animals and plants</div>
  <h1>B4.7 Transport systems in plants ⚡ Quick Check</h1>
  <p>20 questions — 10 multiple choice, 10 true/false. See how well you know your xylem from your phloem!</p>
  <div class="nav">
    <a href="index.html">🏠 Main hub</a>
    <a href="biology-index.html">📚 Biology</a>
    <a href="biology-b4-7-revision.html">📖 Revision</a>
  </div>
</section>

<div id="prev-banner"></div>

<div class="progress-wrap"><div class="progress-bar" id="prog"></div></div>
<div class="score-bar">Score: <span id="live-score">0</span> / <span id="live-total">20</span> &nbsp;|&nbsp; Answered: <span id="live-ans">0</span></div>

<div id="quiz"></div>
<div id="result-box">
  <h2 id="res-emoji"></h2>
  <div id="res-msg" class="sub"></div>
  <div id="res-mum" class="mum"></div>
  <button class="reset-btn" onclick="resetQuiz()">🔄 Try again</button>
</div>

</div>

<script>
const SCORE_KEY='biology-b4-7-score';
const DATE_KEY='biology-b4-7-date';
const TOTAL=20;

// Show previous score
(function(){
  var s=localStorage.getItem(SCORE_KEY);
  var d=localStorage.getItem(DATE_KEY);
  if(s!==null&&d){
    var b=document.getElementById('prev-banner');
    b.style.display='block';
    b.textContent='🕐 Last attempt: '+s+'/'+TOTAL+' — '+d;
  }
})();

const MCQ=[
  {
    q:"Which tissue transports water and dissolved mineral ions in plants?",
    opts:["Phloem","Xylem","Epidermis","Mesophyll"],
    ans:1
  },
  {
    q:"Which tissue transports dissolved sugars (sucrose) in plants?",
    opts:["Xylem","Stomata","Phloem","Cambium"],
    ans:2
  },
  {
    q:"In which direction does water move through the xylem?",
    opts:["Downwards only","Upwards only","Both directions","Sideways only"],
    ans:1
  },
  {
    q:"What is the name for the process by which sugars are transported through the phloem?",
    opts:["Transpiration","Osmosis","Translocation","Diffusion"],
    ans:2
  },
  {
    q:"Why are mature xylem cells described as dead?",
    opts:["They contain no cell wall","They are hollow with no cell contents, forming empty tubes","They have no nucleus only","They actively pump water"],
    ans:1
  },
  {
    q:"Where in the plant are sugars produced that are then transported by the phloem?",
    opts:["Roots","Flowers","Leaves and green parts (photosynthesis)","Stem only"],
    ans:2
  },
  {
    q:"What strengthens the walls of xylem vessels?",
    opts:["Cellulose only","Lignin","Protein fibres","Starch"],
    ans:1
  },
  {
    q:"Which of the following is a destination for sugars transported by phloem?",
    opts:["Xylem vessels","Stomata","Storage organs such as roots and tubers","Lignified cell walls"],
    ans:2
  },
  {
    q:"An aphid feeds by pushing its mouthpart into which tissue?",
    opts:["Xylem","Epidermis","Phloem","Stomata"],
    ans:2
  },
  {
    q:"If a complete ring of bark is stripped from a tree trunk, what happens to the tree?",
    opts:["It loses water too fast via xylem","It survives because xylem is unaffected","It dies because the phloem under the bark is destroyed, stopping translocation","Nothing — bark is dead tissue only"],
    ans:2
  }
];

const TF=[
  {q:"Phloem cells are living cells that require energy to transport sugars.",ans:true},
  {q:"Xylem transports sugars made during photosynthesis.",ans:false},
  {q:"The process of water moving up through xylem is driven by transpiration from the leaves.",ans:true},
  {q:"Phloem transports substances in one direction only — always upwards.",ans:false},
  {q:"Mineral ions needed for plant growth are absorbed from the soil by the roots.",ans:true},
  {q:"In woody trees, xylem makes up the bulk of the wood.",ans:true},
  {q:"Companion cells supply energy for translocation in the xylem.",ans:false},
  {q:"Vascular bundles contain both xylem and phloem tissue.",ans:true},
  {q:"Sucrose is the main sugar transported through the phloem.",ans:true},
  {q:"Xylem vessels have sieve plates that allow materials to pass between cells.",ans:false}
];

let score=0;
let answered=0;

function buildQuiz(){
  const container=document.getElementById('quiz');
  container.innerHTML='';
  // MCQ
  MCQ.forEach((q,i)=>{
    container.appendChild(makeBlock('MCQ',i+1,q,'mcq',i));
  });
  // TF
  TF.forEach((q,i)=>{
    container.appendChild(makeBlock('True or False',MCQ.length+i+1,q,'tf',i));
  });
}

function makeBlock(type,num,q,kind,idx){
  const div=document.createElement('div');
  div.className='q-block';
  div.id='block-'+kind+'-'+idx;
  const label=document.createElement('div');
  label.className='q-num';
  label.textContent='Q'+num+' · '+type;
  const qtext=document.createElement('div');
  qtext.className='q-text';
  qtext.textContent=q.q;
  div.appendChild(label);
  div.appendChild(qtext);

  if(kind==='mcq'){
    const opts=document.createElement('div');
    opts.className='options';
    q.opts.forEach((o,oi)=>{
      const btn=document.createElement('button');
      btn.className='opt-btn';
      btn.textContent=o;
      btn.onclick=()=>answerMCQ(idx,oi,q.ans,div);
      opts.appendChild(btn);
    });
    div.appendChild(opts);
  } else {
    const tf=document.createElement('div');
    tf.className='tf-wrap';
    ['✅ True','❌ False'].forEach((label,li)=>{
      const btn=document.createElement('button');
      btn.className='tf-btn';
      btn.textContent=label;
      btn.onclick=()=>answerTF(idx,li===0,q.ans,div);
      tf.appendChild(btn);
    });
    div.appendChild(tf);
  }

  const fb=document.createElement('div');
  fb.className='feedback';
  fb.id='fb-'+kind+'-'+idx;
  div.appendChild(fb);
  return div;
}

function answerMCQ(idx,chosen,correct,block){
  const btns=block.querySelectorAll('.opt-btn');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===correct) b.classList.add('correct');
    else if(i===chosen) b.classList.add('wrong');
  });
  const right=chosen===correct;
  showFeedback('mcq',idx,right,right?'✅ Correct!':'❌ Incorrect — the correct answer is highlighted.');
  updateScore(right);
}

function answerTF(idx,chosen,correct,block){
  const btns=block.querySelectorAll('.tf-btn');
  btns.forEach((b,i)=>{
    b.disabled=true;
    const isTrue=i===0;
    if(isTrue===correct) b.classList.add('correct');
    else if(isTrue===chosen) b.classList.add('wrong');
  });
  const right=chosen===correct;
  showFeedback('tf',idx,right,right?'✅ Correct!':'❌ Incorrect — the correct answer is highlighted.');
  updateScore(right);
}

function showFeedback(kind,idx,right,msg){
  const fb=document.getElementById('fb-'+kind+'-'+idx);
  fb.className='feedback '+(right?'correct':'wrong');
  fb.textContent=msg;
}

function updateScore(right){
  if(right) score++;
  answered++;
  document.getElementById('live-score').textContent=score;
  document.getElementById('live-ans').textContent=answered;
  document.getElementById('prog').style.width=(answered/TOTAL*100)+'%';
  if(answered===TOTAL) showResult();
}

function showResult(){
  // Save
  const today=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  localStorage.setItem(SCORE_KEY,score);
  localStorage.setItem(DATE_KEY,today);

  const box=document.getElementById('result-box');
  box.style.display='block';
  box.scrollIntoView({behavior:'smooth'});

  let emoji,msg;
  if(score>=18){emoji='🏆';msg='Outstanding! You really know your xylem from your phloem.';}
  else if(score>=14){emoji='👍';msg='Good work — a few gaps to plug. Check the revision page.';}
  else{emoji='📖';msg='Keep going — revisit the revision notes and try again.';}

  document.getElementById('res-emoji').textContent=emoji;
  document.getElementById('res-msg').textContent=msg;
  document.getElementById('res-mum').textContent='Show this to mum — '+score+'/'+TOTAL;
}

function resetQuiz(){
  score=0;
  answered=0;
  document.getElementById('live-score').textContent=0;
  document.getElementById('live-ans').textContent=0;
  document.getElementById('prog').style.width='0%';
  document.getElementById('result-box').style.display='none';
  buildQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}

buildQuiz();
</script>
</body>
</html>
