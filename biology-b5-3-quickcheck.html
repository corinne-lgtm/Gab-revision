<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biology – B5.3 Quick Check</title>
<style>
:root{--bg:#f0f7ee;--ink:#1a2e1a;--muted:#5a7a5a;--paper:#f9fdf7;--line:#c8dfc8;--green:#3a7d44;--green2:#d4edda;--lime:#7ab648;--lime2:#e8f5d8;--blue:#2e6b8a;--blue2:#d4eaf5;--orange:#e07b2a;--orange2:#fde8cc;--purple:#6b4a9a;--purple2:#e8daf5;--dark:#1a2e1a;--yellow:#c8e040;--red:#c0392b;--red2:#fde8e6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at top left,rgba(58,125,68,.1),transparent 34%),radial-gradient(circle at top right,rgba(122,182,72,.12),transparent 34%),var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.4;min-height:100vh}
.wrap{max-width:780px;margin:0 auto;padding:24px}
/* HERO */
.hero{background:linear-gradient(135deg,#1a2e1a,#3a7d44);color:white;border-radius:30px;padding:28px 30px;margin-bottom:18px;box-shadow:0 14px 35px rgba(0,0,0,.18)}
.kicker{font-weight:900;text-transform:uppercase;letter-spacing:2px;color:#c8e040;font-size:12px;margin-bottom:8px}
h1{font-size:clamp(22px,4vw,40px);line-height:1;letter-spacing:-1px}
.hero p{font-size:15px;color:rgba(255,255,255,.8);margin-top:6px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.nav a{background:white;color:#1a2e1a;text-decoration:none;font-weight:900;padding:8px 14px;border-radius:999px;font-size:13px}
/* PREV SCORE BANNER */
#prev-banner{display:none;background:var(--orange2);border:2px solid var(--orange);border-radius:16px;padding:12px 18px;margin-bottom:16px;font-size:14px;font-weight:700;color:#7a3a00}
/* PROGRESS */
#progress-wrap{background:var(--line);border-radius:999px;height:10px;margin-bottom:20px;overflow:hidden}
#progress-bar{height:10px;background:var(--yellow);border-radius:999px;width:0%;transition:width .4s}
/* Q-BLOCKS */
.q-block{background:rgba(255,255,255,.85);border:2px solid var(--line);border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.q-num{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px}
.q-text{font-size:17px;font-weight:700;margin-bottom:14px;line-height:1.3}
/* MCQ options */
.options{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:11px 16px;cursor:pointer;font-size:15px;font-weight:600;transition:background .15s,border-color .15s;text-align:left}
.opt:hover{background:var(--lime2);border-color:var(--lime)}
.opt.correct{background:var(--green2);border-color:var(--green);color:#0d3d1a}
.opt.wrong{background:var(--red2);border-color:var(--red);color:#5a0a0a}
.opt.reveal{background:#eee;color:#999;border-color:#ccc}
/* TF */
.tf-row{display:flex;gap:10px}
.tf-btn{flex:1;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-size:16px;font-weight:900;transition:background .15s}
.tf-btn:hover{background:var(--lime2);border-color:var(--lime)}
.tf-btn.correct{background:var(--green2);border-color:var(--green)}
.tf-btn.wrong{background:var(--red2);border-color:var(--red)}
.tf-btn.reveal{background:#eee;color:#999;border-color:#ccc}
/* FEEDBACK */
.feedback{margin-top:10px;font-size:14px;border-radius:12px;padding:10px 14px;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--green2);color:#0d3d1a;border:1.5px solid var(--green)}
.feedback.bad{background:var(--red2);color:#5a0a0a;border:1.5px solid var(--red)}
/* RESULT */
#result-box{display:none;background:rgba(255,255,255,.92);border:2px solid var(--line);border-radius:28px;padding:28px;text-align:center;margin-top:20px;box-shadow:0 8px 28px rgba(0,0,0,.1)}
#result-box h2{font-size:clamp(22px,4vw,40px);margin-bottom:10px}
#result-box .sub{font-size:16px;color:var(--muted);margin-bottom:16px}
#result-box .msg{font-size:19px;font-weight:900;padding:16px 20px;border-radius:16px;margin-bottom:18px}
#result-box .msg.great{background:var(--green2);color:#0d3d1a}
#result-box .msg.ok{background:var(--lime2);color:#2a4a0d}
#result-box .msg.retry{background:var(--red2);color:#5a0a0a}
#reset-btn{background:var(--dark);color:var(--yellow);border:none;padding:13px 28px;border-radius:999px;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit}
#reset-btn:hover{opacity:.85}
@media(max-width:600px){.wrap{padding:14px}.q-text{font-size:15px}.opt{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">

<section class="hero">
  <div class="kicker">AQA GCSE Biology · B5 Communicable diseases</div>
  <h1>B5.3 Quick Check ⚡</h1>
  <p>Preventing infections — 20 questions</p>
  <div class="nav">
    <a href="index.html">🏠 Main hub</a>
    <a href="biology-index.html">📚 Biology</a>
    <a href="biology-b5-3-revision.html">📖 Revision</a>
  </div>
</section>

<div id="prev-banner"></div>
<div id="progress-wrap"><div id="progress-bar"></div></div>

<div id="quiz"></div>
<div id="result-box">
  <h2 id="r-emoji"></h2>
  <div class="sub" id="r-score"></div>
  <div class="msg" id="r-msg"></div>
  <button id="reset-btn" onclick="resetQuiz()">🔄 Try again</button>
</div>

</div><!-- .wrap -->

<script>
const SCORE_KEY='biology-b5-3-score';
const DATE_KEY='biology-b5-3-date';
const TOTAL=20;

// Previous score banner
(function(){
  var s=localStorage.getItem(SCORE_KEY);
  var d=localStorage.getItem(DATE_KEY);
  if(s!==null&&d){
    var b=document.getElementById('prev-banner');
    b.style.display='block';
    b.textContent='📊 Last attempt: '+s+'/'+TOTAL+' on '+d;
  }
})();

const MCQ=[
  {
    q:'Who insisted that doctors should wash their hands before delivering babies in the 1850s?',
    opts:['Joseph Lister','Louis Pasteur','Ignaz Semmelweis','Robert Koch'],
    ans:2
  },
  {
    q:'Why were other doctors initially resistant to Semmelweis\'s ideas?',
    opts:['They thought handwashing was too slow','Germ theory had not yet been established','They had already washed their hands','Hospitals did not have running water'],
    ans:1
  },
  {
    q:'Which scientist proved that microorganisms cause disease (germ theory)?',
    opts:['Ignaz Semmelweis','Joseph Lister','Florence Nightingale','Louis Pasteur'],
    ans:3
  },
  {
    q:'Joseph Lister pioneered the use of which substances in operating theatres?',
    opts:['Antibiotics','Antiseptic chemicals','Vaccinations','Disinfectant tablets'],
    ans:1
  },
  {
    q:'What did improvements in microscopes allow scientists to do, helping acceptance of germ theory?',
    opts:['Develop vaccines more quickly','See pathogens directly','Perform surgery more safely','Test antiseptics on bacteria'],
    ans:1
  },
  {
    q:'Which of the following is NOT a method of preventing the spread of communicable diseases?',
    opts:['Hygiene','Isolating infected individuals','Taking painkillers','Destroying vectors'],
    ans:2
  },
  {
    q:'Mosquitoes are an example of a:',
    opts:['Pathogen','Host','Vector','Bacterium'],
    ans:2
  },
  {
    q:'Why can vaccines NOT be used to protect plants from disease?',
    opts:['Plants are too small to inject','Plants do not have an immune system','Plant pathogens are different from animal pathogens','Vaccines are too expensive for farming'],
    ans:1
  },
  {
    q:'How does vaccination help prevent disease?',
    opts:['It kills bacteria already in the body','It introduces a harmless form of a pathogen so the immune system is prepared','It destroys vectors that spread disease','It creates antibiotics inside the body'],
    ans:1
  },
  {
    q:'Aphids can transmit over 150 plant diseases. Aphids are an example of a:',
    opts:['Fungal pathogen','Plant vaccine','Vector','Disinfectant agent'],
    ans:2
  }
];

const TF=[
  {q:'Semmelweis introduced antiseptic chemicals into operating theatres.',ans:false,exp:'That was Joseph Lister. Semmelweis introduced handwashing for doctors delivering babies.'},
  {q:'Pasteur developed vaccines against anthrax and rabies.',ans:true,exp:'Correct — Pasteur proved germ theory and developed vaccines against anthrax and rabies.'},
  {q:'Isolating infected individuals helps prevent the spread of disease because fewer contacts means fewer opportunities for pathogens to be passed on.',ans:true,exp:'Correct — isolation reduces contact and therefore reduces transmission.'},
  {q:'Handwashing only prevents diseases that are spread through direct skin-to-skin contact.',ans:false,exp:'Handwashing prevents many types of spread, including via contaminated food, surfaces and indirect contact.'},
  {q:'Houseflies can carry more than 100 human diseases.',ans:true,exp:'Correct — houseflies are vectors for over 100 human diseases.'},
  {q:'Vaccination works by introducing a large dose of the active, harmful pathogen into the body.',ans:false,exp:'Vaccination uses a harmless (or weakened) form of the pathogen — not a large dose of the active harmful one.'},
  {q:'Keeping raw meat away from ready-to-eat food is an example of a hygiene measure to prevent disease spread.',ans:true,exp:'Correct — this prevents cross-contamination, which can spread pathogens like Salmonella.'},
  {q:'Destroying vectors can help prevent the spread of malaria.',ans:true,exp:'Correct — mosquitoes are the vector for malaria; controlling them reduces spread.'},
  {q:'Plants can be vaccinated against communicable diseases in the same way as animals.',ans:false,exp:'Plants have no immune system, so vaccination does not work for them.'},
  {q:'One reason doctors rejected Semmelweis was that his ideas challenged their belief that they were professional and clean.',ans:true,exp:'Correct — the idea that doctors were causing patient deaths was considered offensive and professionally threatening.'}
];

let answers={};
let answered={};
let total=TOTAL;

function buildQuiz(){
  answers={};answered={};
  var html='';
  MCQ.forEach(function(q,i){
    html+='<div class="q-block" id="qb-'+i+'">';
    html+='<div class="q-num">Question '+(i+1)+' of '+TOTAL+'</div>';
    html+='<div class="q-text">'+q.q+'</div>';
    html+='<div class="options">';
    q.opts.forEach(function(o,j){
      html+='<button class="opt" onclick="answerMCQ('+i+','+j+')" id="opt-'+i+'-'+j+'">'+o+'</button>';
    });
    html+='</div>';
    html+='<div class="feedback" id="fb-'+i+'"></div>';
    html+='</div>';
  });
  TF.forEach(function(q,i){
    var qi=MCQ.length+i;
    html+='<div class="q-block" id="qb-'+qi+'">';
    html+='<div class="q-num">Question '+(qi+1)+' of '+TOTAL+'</div>';
    html+='<div class="q-text">True or False? '+q.q+'</div>';
    html+='<div class="tf-row">';
    html+='<button class="tf-btn" onclick="answerTF('+i+',true)" id="tf-'+i+'-true">✅ True</button>';
    html+='<button class="tf-btn" onclick="answerTF('+i+',false)" id="tf-'+i+'-false">❌ False</button>';
    html+='</div>';
    html+='<div class="feedback" id="fb-'+qi+'"></div>';
    html+='</div>';
  });
  document.getElementById('quiz').innerHTML=html;
  updateProgress();
}

function updateProgress(){
  var done=Object.keys(answered).length;
  document.getElementById('progress-bar').style.width=Math.round((done/TOTAL)*100)+'%';
}

function answerMCQ(qi,chosen){
  if(answered[qi])return;
  answered[qi]=true;
  answers[qi]=(chosen===MCQ[qi].ans)?1:0;
  var correct=chosen===MCQ[qi].ans;
  MCQ[qi].opts.forEach(function(_,j){
    var btn=document.getElementById('opt-'+qi+'-'+j);
    if(j===MCQ[qi].ans){btn.classList.add('correct');}
    else if(j===chosen&&!correct){btn.classList.add('wrong');}
    else{btn.classList.add('reveal');}
    btn.disabled=true;
  });
  var fb=document.getElementById('fb-'+qi);
  fb.className='feedback show '+(correct?'ok':'bad');
  fb.textContent=correct?'✅ Correct!':'❌ The correct answer is: '+MCQ[qi].opts[MCQ[qi].ans];
  updateProgress();
  checkDone();
}

function answerTF(i,chosen){
  var qi=MCQ.length+i;
  if(answered[qi])return;
  answered[qi]=true;
  var correct=(chosen===TF[i].ans);
  answers[qi]=correct?1:0;
  ['true','false'].forEach(function(v){
    var btn=document.getElementById('tf-'+i+'-'+v);
    var val=(v==='true');
    if(val===TF[i].ans){btn.classList.add('correct');}
    else if(val===chosen&&!correct){btn.classList.add('wrong');}
    else{btn.classList.add('reveal');}
    btn.disabled=true;
  });
  var fb=document.getElementById('fb-'+qi);
  fb.className='feedback show '+(correct?'ok':'bad');
  fb.textContent=(correct?'✅ Correct! ':'❌ '+(TF[i].ans?'True':'False')+'. ')+TF[i].exp;
  updateProgress();
  checkDone();
}

function checkDone(){
  if(Object.keys(answered).length<TOTAL)return;
  var score=0;
  Object.values(answers).forEach(function(v){score+=v;});
  // Save
  localStorage.setItem(SCORE_KEY,score);
  var now=new Date();
  localStorage.setItem(DATE_KEY,now.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}));
  // Show result
  var rb=document.getElementById('result-box');
  rb.style.display='block';
  var emoji=score>=18?'🏆':score>=14?'👍':'📖';
  document.getElementById('r-emoji').textContent=emoji;
  document.getElementById('r-score').textContent='You scored '+score+' out of '+TOTAL;
  var msg=document.getElementById('r-msg');
  if(score>=18){
    msg.className='msg great';
    msg.textContent='Show this to mum — '+score+'/'+TOTAL+'! Outstanding! 🎉';
  } else if(score>=14){
    msg.className='msg ok';
    msg.textContent='Show this to mum — '+score+'/'+TOTAL+'. Good effort, keep revising! 💪';
  } else {
    msg.className='msg retry';
    msg.textContent='Show this to mum — '+score+'/'+TOTAL+'. Go back to the revision sheet! 📖';
  }
  rb.scrollIntoView({behavior:'smooth',block:'center'});
}

function resetQuiz(){
  document.getElementById('result-box').style.display='none';
  buildQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}

buildQuiz();
</script>
</body>
</html>
