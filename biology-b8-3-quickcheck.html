<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biology – B8.3 Quick Check</title>
<style>
:root{--bg:#f0f7ee;--ink:#1a2e1a;--muted:#5a7a5a;--paper:#f9fdf7;--line:#c8dfc8;--green:#3a7d44;--green2:#d4edda;--lime:#7ab648;--lime2:#e8f5d8;--blue:#2e6b8a;--blue2:#d4eaf5;--orange:#e07b2a;--orange2:#fde8cc;--purple:#6b4a9a;--purple2:#e8daf5;--dark:#1a2e1a;--yellow:#c8e040;--red:#c0392b;--red2:#fde8e6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at top left,rgba(58,125,68,.1),transparent 34%),radial-gradient(circle at top right,rgba(122,182,72,.12),transparent 34%),var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.4;min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:24px}
.hero{background:linear-gradient(135deg,#1a2e1a,#3a7d44);color:white;border-radius:30px;padding:30px;margin-bottom:22px;box-shadow:0 14px 35px rgba(0,0,0,.18)}
.kicker{font-weight:900;text-transform:uppercase;letter-spacing:2px;color:#c8e040;font-size:13px;margin-bottom:10px}
h1{font-size:clamp(22px,4vw,44px);line-height:1;letter-spacing:-1px}
.hero p{font-size:15px;color:rgba(255,255,255,.8);margin-top:8px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.nav a{background:white;color:#1a2e1a;text-decoration:none;font-weight:900;padding:9px 14px;border-radius:999px;font-size:14px}
/* prev score banner */
#prev-banner{display:none;background:var(--orange2);border:2px solid var(--orange);border-radius:16px;padding:12px 16px;margin-bottom:16px;font-size:14px;font-weight:700;color:#7a3a0a}
/* progress bar */
.prog-wrap{background:var(--line);border-radius:999px;height:10px;margin-bottom:22px;overflow:hidden}
.prog-bar{height:10px;background:var(--yellow);border-radius:999px;width:0%;transition:width .4s ease}
/* score bar */
.score-bar{background:white;border:2px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:900;font-size:14px;margin-bottom:18px;display:inline-block}
/* q blocks */
.q-block{background:rgba(255,255,255,.85);border:2px solid var(--line);border-radius:24px;padding:22px;margin-bottom:18px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.q-num{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
.q-text{font-size:17px;font-weight:700;margin-bottom:14px;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:11px 16px;cursor:pointer;font-size:15px;font-weight:600;text-align:left;transition:border-color .15s,background .15s;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--green);background:var(--green2)}
.opt.correct{background:var(--green2);border-color:var(--green);color:#1a4d22}
.opt.wrong{background:var(--red2);border-color:var(--red);color:#7a1010}
.tf-row{display:flex;gap:10px}
.tf-btn{flex:1;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--paper);font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s}
.tf-btn:hover:not(:disabled){border-color:var(--green);background:var(--green2)}
.tf-btn.correct{background:var(--green2);border-color:var(--green);color:#1a4d22}
.tf-btn.wrong{background:var(--red2);border-color:var(--red);color:#7a1010}
.feedback{margin-top:10px;font-size:14px;font-weight:700;padding:8px 12px;border-radius:10px;display:none}
.feedback.ok{background:var(--green2);color:#1a4d22;display:block}
.feedback.bad{background:var(--red2);color:#7a1010;display:block}
/* result box */
#result{display:none;background:rgba(255,255,255,.9);border:3px solid var(--green);border-radius:28px;padding:28px;text-align:center;margin-top:24px;box-shadow:0 8px 30px rgba(0,0,0,.1)}
#result .big{font-size:54px;margin-bottom:6px}
#result h2{font-size:clamp(20px,3vw,32px);margin-bottom:8px}
#result p{color:var(--muted);font-size:15px;margin-bottom:18px}
#result .score-display{font-size:28px;font-weight:900;color:var(--green);margin-bottom:6px}
.reset-btn{background:linear-gradient(135deg,#1a2e1a,#3a7d44);color:white;border:none;border-radius:999px;padding:13px 28px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;margin-top:8px}
@media(max-width:600px){.wrap{padding:14px}.tf-row{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">

<section class="hero">
  <div class="kicker">AQA GCSE Biology · B8 Photosynthesis</div>
  <h1>B8.3 Quick Check ⚡</h1>
  <p>How plants use glucose · Nitrates · Starch test · Carnivorous plants — 20 questions</p>
  <div class="nav">
    <a href="index.html">🏠 Main hub</a>
    <a href="biology-index.html">📚 Biology</a>
    <a href="biology-b8-3-revision.html">📖 Revision</a>
  </div>
</section>

<div id="prev-banner"></div>

<div class="prog-wrap"><div class="prog-bar" id="prog"></div></div>
<div class="score-bar">Score: <span id="live-score">0</span> / 20</div>

<div id="quiz"></div>
<div id="result">
  <div class="big" id="res-emoji"></div>
  <h2 id="res-title"></h2>
  <div class="score-display" id="res-score"></div>
  <p id="res-msg"></p>
  <button class="reset-btn" onclick="resetQuiz()">🔄 Try again</button>
</div>

</div>

<script>
const SCORE_KEY='biology-b8-3-qc-score';
const DATE_KEY='biology-b8-3-qc-date';
const TOTAL=20;

// Show previous score banner
(function(){
  var s=localStorage.getItem(SCORE_KEY);
  var d=localStorage.getItem(DATE_KEY);
  if(s!==null&&d){
    var b=document.getElementById('prev-banner');
    b.style.display='block';
    b.textContent='📋 Last attempt: '+s+'/'+TOTAL+' on '+d;
  }
})();

const MCQ=[
  {q:"Which of these is NOT a way a plant uses glucose?",opts:["Respiration","Cellulose production","Absorbing nitrates","Starch storage"],ans:2},
  {q:"Why is glucose stored as starch rather than remaining as glucose in plant cells?",opts:["Glucose is too large to store","Starch releases energy faster","Starch is insoluble and does not affect osmosis","Starch is easier to transport"],ans:2},
  {q:"Which mineral ion must plants absorb from the soil to make amino acids?",opts:["Magnesium ions","Potassium ions","Nitrate ions","Calcium ions"],ans:2},
  {q:"What is cellulose used for in plant cells?",opts:["Energy storage","Strengthening cell walls","Making enzymes","Storing nitrates"],ans:1},
  {q:"Which step in the starch test removes chlorophyll from the leaf?",opts:["Boiling in water","Adding iodine solution","Boiling in ethanol","Rinsing in hot water"],ans:2},
  {q:"What colour does iodine turn when starch is present?",opts:["Red","Orange-brown","Blue-black","Purple"],ans:2},
  {q:"What do plants produce from glucose and nitrate ions?",opts:["Cellulose","Lipids","Amino acids","Starch"],ans:2},
  {q:"Which of these is the correct reason for using a water bath rather than a direct flame when heating ethanol?",opts:["Ethanol is an acid","Ethanol is volatile and flammable","Ethanol dissolves iodine","Ethanol boils at 100°C"],ans:1},
  {q:"Where in a plant would you typically find starch stored long-term?",opts:["Flowers and petals","Tubers and bulbs (e.g. potatoes, onions)","Roots only","Xylem vessels"],ans:1},
  {q:"A leaf kept in the dark for 24 hours is tested for starch with iodine. What result would you expect?",opts:["Blue-black — starch is always present","Orange-brown — no starch was made","Purple — starch broke down overnight","Yellow — chlorophyll reacted with iodine"],ans:1},
];

const TF=[
  {q:"Plants only respire at night, when photosynthesis cannot occur.",ans:false},
  {q:"Fats and oils (lipids) are used as energy stores, particularly in seeds.",ans:true},
  {q:"Glucose alone is sufficient for a plant to produce proteins.",ans:false},
  {q:"Carnivorous plants digest insects to obtain nitrates and other minerals.",ans:true},
  {q:"The ethanol step in the starch test is carried out to kill the leaf cells.",ans:false},
  {q:"Starch is soluble in water, which is why it is used as a storage molecule.",ans:false},
  {q:"Algae obtain nitrate ions from the water they live in.",ans:true},
  {q:"After a carnivorous plant digests an insect, the trap reopens ready to catch another.",ans:true},
  {q:"Cellulose is a complex carbohydrate made from glucose.",ans:true},
  {q:"Seeds are often rich in oils, which has led to interest in using them as biofuels.",ans:true},
];

let answered=0;
let score=0;

function build(){
  const container=document.getElementById('quiz');
  container.innerHTML='';
  // MCQ (Q1-10)
  MCQ.forEach((item,i)=>{
    const div=document.createElement('div');
    div.className='q-block';
    div.id='q'+i;
    div.innerHTML=`<div class="q-num">Question ${i+1} of 20</div><div class="q-text">${item.q}</div><div class="opts">${item.opts.map((o,j)=>`<button class="opt" onclick="answerMCQ(${i},${j})">${o}</button>`).join('')}</div><div class="feedback" id="fb${i}"></div>`;
    container.appendChild(div);
  });
  // TF (Q11-20)
  TF.forEach((item,i)=>{
    const gi=i+10;
    const div=document.createElement('div');
    div.className='q-block';
    div.id='q'+gi;
    div.innerHTML=`<div class="q-num">Question ${gi+1} of 20</div><div class="q-text">${item.q}</div><div class="tf-row"><button class="tf-btn" onclick="answerTF(${i},true)">✅ True</button><button class="tf-btn" onclick="answerTF(${i},false)">❌ False</button></div><div class="feedback" id="fbtf${i}"></div>`;
    container.appendChild(div);
  });
}

function answerMCQ(qi,chosen){
  const block=document.getElementById('q'+qi);
  const btns=block.querySelectorAll('.opt');
  btns.forEach(b=>b.disabled=true);
  const correct=MCQ[qi].ans;
  const fb=document.getElementById('fb'+qi);
  if(chosen===correct){
    btns[chosen].classList.add('correct');
    fb.className='feedback ok';
    fb.textContent='✅ Correct!';
    score++;
    document.getElementById('live-score').textContent=score;
  } else {
    btns[chosen].classList.add('wrong');
    btns[correct].classList.add('correct');
    fb.className='feedback bad';
    fb.textContent='❌ The correct answer is: '+MCQ[qi].opts[correct];
  }
  answered++;
  updateProgress();
  if(answered===TOTAL) showResult();
}

function answerTF(qi,chosen){
  const gi=qi+10;
  const block=document.getElementById('q'+gi);
  const btns=block.querySelectorAll('.tf-btn');
  btns.forEach(b=>b.disabled=true);
  const correct=TF[qi].ans;
  const fb=document.getElementById('fbtf'+qi);
  const chosenBtn=chosen===true?btns[0]:btns[1];
  const correctBtn=correct===true?btns[0]:btns[1];
  if(chosen===correct){
    chosenBtn.classList.add('correct');
    fb.className='feedback ok';
    fb.textContent='✅ Correct!';
    score++;
    document.getElementById('live-score').textContent=score;
  } else {
    chosenBtn.classList.add('wrong');
    correctBtn.classList.add('correct');
    fb.className='feedback bad';
    fb.textContent='❌ The answer is '+(correct?'True':'False')+'.';
  }
  answered++;
  updateProgress();
  if(answered===TOTAL) showResult();
}

function updateProgress(){
  document.getElementById('prog').style.width=(answered/TOTAL*100)+'%';
}

function showResult(){
  // Save to localStorage
  var today=new Date();
  var d=today.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  localStorage.setItem(SCORE_KEY,score);
  localStorage.setItem(DATE_KEY,d);
  // Show result box
  const box=document.getElementById('result');
  box.style.display='block';
  document.getElementById('res-score').textContent=score+' / '+TOTAL;
  if(score>=18){
    document.getElementById('res-emoji').textContent='🏆';
    document.getElementById('res-title').textContent='Outstanding!';
    document.getElementById('res-msg').textContent='You\'ve nailed B8.3. Show this to mum — '+score+'/'+TOTAL+'!';
  } else if(score>=14){
    document.getElementById('res-emoji').textContent='👍';
    document.getElementById('res-title').textContent='Good work!';
    document.getElementById('res-msg').textContent='Solid score — review any mistakes then show this to mum — '+score+'/'+TOTAL+'!';
  } else {
    document.getElementById('res-emoji').textContent='📖';
    document.getElementById('res-title').textContent='Keep revising!';
    document.getElementById('res-msg').textContent='Go back to the revision notes, then try again. Show this to mum — '+score+'/'+TOTAL+'!';
  }
  box.scrollIntoView({behavior:'smooth'});
}

function resetQuiz(){
  answered=0;score=0;
  document.getElementById('live-score').textContent=0;
  document.getElementById('prog').style.width='0%';
  document.getElementById('result').style.display='none';
  build();
  window.scrollTo({top:0,behavior:'smooth'});
}

build();
</script>
</body>
</html>
