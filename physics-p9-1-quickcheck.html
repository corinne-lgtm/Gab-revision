<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P9.1 Quick Check · Speed & Distance–Time Graphs</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e8f4fd;
      --ink: #0d1b2a;
      --muted: #5a7a95;
      --paper: #ffffff;
      --line: #c8dff0;
      --card-border: #b8d4ea;
      --hero-bg: #0d2b45;
      --accent: #64b5f6;
      --accent2: #1976d2;
      --accent3: #0d47a1;
      --green: #e8f5e9;
      --green2: #2e7d32;
      --red: #fde8e8;
      --red2: #c62828;
      --orange2: #e65100;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }

    /* NAV */
    nav {
      background: var(--hero-bg);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      flex-wrap: wrap;
    }
    .nav-logo {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--accent);
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
    .nav-links a {
      font-size: 0.78rem;
      font-weight: 700;
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid rgba(255,255,255,0.15);
      transition: all 0.2s;
    }
    .nav-links a:hover { background: rgba(100,181,246,0.2); color: var(--accent); border-color: var(--accent); }

    /* HERO */
    .hero {
      background: var(--hero-bg);
      padding: 52px 28px 70px;
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 25% 50%, rgba(100,181,246,0.18) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(25,118,210,0.2) 0%, transparent 50%);
    }
    .floating-emojis { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .fe { position: absolute; opacity: 0.1; animation: floatUp 6s ease-in-out infinite; }
    .fe:nth-child(1) { left: 6%;  top: 25%; font-size: 2.2rem; animation-delay: 0s; }
    .fe:nth-child(2) { left: 18%; top: 65%; font-size: 1.6rem; animation-delay: 1.2s; }
    .fe:nth-child(3) { left: 72%; top: 15%; font-size: 2rem;   animation-delay: 2s; }
    .fe:nth-child(4) { left: 84%; top: 60%; font-size: 1.8rem; animation-delay: 0.6s; }
    .fe:nth-child(5) { left: 48%; top: 78%; font-size: 2rem;   animation-delay: 3s; }
    @keyframes floatUp {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%       { transform: translateY(-18px) rotate(7deg); }
    }
    .chapter-badge {
      display: inline-block;
      background: rgba(100,181,246,0.22);
      border: 1.5px solid var(--accent);
      color: var(--accent);
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 0.74rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 5px 16px;
      border-radius: 20px;
      margin-bottom: 16px;
      position: relative;
    }
    .hero h1 {
      font-family: 'Poppins', sans-serif;
      font-weight: 900;
      font-size: clamp(1.7rem, 4.5vw, 2.9rem);
      color: #fff;
      line-height: 1.12;
      margin-bottom: 10px;
      position: relative;
    }
    .hero h1 span { color: var(--accent); }
    .hero .kicker { font-size: 0.95rem; color: rgba(255,255,255,0.58); margin-bottom: 26px; position: relative; }
    .hero-tags { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; position: relative; }
    .hero-tag {
      background: rgba(255,255,255,0.09);
      color: rgba(255,255,255,0.82);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 5px 13px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.14);
    }

    /* SCORE BAR */
    .score-bar {
      background: var(--hero-bg);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 10px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .score-label { color: rgba(255,255,255,0.55); font-size: 0.78rem; font-weight: 600; }
    .progress-track { flex: 1; min-width: 120px; height: 7px; background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), #42a5f5); border-radius: 99px; transition: width 0.4s ease; }
    .score-count { color: var(--accent); font-size: 0.83rem; font-weight: 700; }

    /* MAIN */
    main { max-width: 820px; margin: 0 auto; padding: 36px 18px 80px; display: flex; flex-direction: column; gap: 20px; }

    /* Q-BLOCK */
    .q-block {
      background: var(--paper);
      border-radius: 20px;
      border: 2px solid var(--card-border);
      padding: 24px 24px 20px;
      box-shadow: 0 3px 14px rgba(13,43,69,0.05);
      transition: border-color 0.25s;
    }
    .q-block.correct { border-color: #81c784; }
    .q-block.wrong   { border-color: #e57373; }

    .q-meta {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    .q-num {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 0.78rem;
      color: var(--accent2);
      background: var(--bg);
      border: 1.5px solid var(--line);
      border-radius: 8px;
      padding: 3px 10px;
    }
    .q-type {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      background: var(--bg);
      border-radius: 8px;
      padding: 3px 9px;
      border: 1.5px solid var(--line);
    }
    .q-text {
      font-size: 0.97rem;
      font-weight: 700;
      line-height: 1.5;
      color: var(--ink);
      margin-bottom: 16px;
    }

    /* MCQ options */
    .options { display: flex; flex-direction: column; gap: 9px; }
    .opt {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 15px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      cursor: pointer;
      transition: all 0.18s;
      font-size: 0.88rem;
      font-weight: 600;
      background: #fff;
      text-align: left;
      width: 100%;
    }
    .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--bg); }
    .opt:disabled { cursor: default; }
    .opt .opt-letter {
      width: 26px; min-width: 26px; height: 26px;
      border-radius: 7px;
      background: var(--bg);
      border: 1.5px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 0.78rem;
      color: var(--muted);
      transition: all 0.18s;
    }
    .opt.selected      { border-color: var(--accent2); background: #e3f2fd; }
    .opt.selected .opt-letter { background: var(--accent2); border-color: var(--accent2); color: #fff; }
    .opt.reveal-correct { border-color: #4caf50 !important; background: #e8f5e9 !important; }
    .opt.reveal-correct .opt-letter { background: #4caf50; border-color: #4caf50; color: #fff; }
    .opt.reveal-wrong   { border-color: #e57373 !important; background: #fde8e8 !important; }
    .opt.reveal-wrong   .opt-letter { background: #e57373; border-color: #e57373; color: #fff; }

    /* T/F */
    .tf-wrap { display: flex; gap: 12px; }
    .tf-btn {
      flex: 1;
      padding: 13px;
      border-radius: 13px;
      border: 2px solid var(--line);
      background: #fff;
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.18s;
    }
    .tf-btn:hover:not(:disabled) { border-color: var(--accent2); background: var(--bg); }
    .tf-btn:disabled { cursor: default; }
    .tf-btn.selected      { border-color: var(--accent2); background: #e3f2fd; color: var(--accent2); }
    .tf-btn.reveal-correct { border-color: #4caf50 !important; background: #e8f5e9 !important; color: #2e7d32 !important; }
    .tf-btn.reveal-wrong   { border-color: #e57373 !important; background: #fde8e8 !important; color: #c62828 !important; }

    /* FEEDBACK */
    .feedback {
      display: none;
      margin-top: 14px;
      padding: 12px 15px;
      border-radius: 11px;
      font-size: 0.86rem;
      font-weight: 600;
      line-height: 1.5;
      border-left: 4px solid;
    }
    .feedback.show { display: block; }
    .feedback.correct-fb { background: #e8f5e9; border-color: #4caf50; color: #1b5e20; }
    .feedback.wrong-fb   { background: #fde8e8; border-color: #e57373; color: #b71c1c; }

    /* SUBMIT BTN */
    .submit-row { display: flex; justify-content: center; margin-top: 8px; }
    .check-btn {
      background: var(--accent2);
      color: #fff;
      border: none;
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 0.92rem;
      padding: 11px 32px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 3px 10px rgba(25,118,210,0.25);
    }
    .check-btn:hover:not(:disabled) { background: var(--accent3); transform: translateY(-1px); }
    .check-btn:disabled { background: #b0bec5; cursor: default; box-shadow: none; transform: none; }

    /* RESULT BOX */
    .result-box {
      display: none;
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      border: 2px solid var(--card-border);
    }
    .result-box.show { display: block; }
    .result-great  { background: linear-gradient(135deg, #e8f5e9, #c8e6c9); border-color: #81c784; }
    .result-ok     { background: linear-gradient(135deg, #fff3e0, #ffe0b2); border-color: #ffb74d; }
    .result-retry  { background: linear-gradient(135deg, #fde8e8, #ffcdd2); border-color: #e57373; }
    .result-emoji  { font-size: 3rem; margin-bottom: 12px; }
    .result-score  {
      font-family: 'Poppins', sans-serif;
      font-weight: 900;
      font-size: 3rem;
      line-height: 1;
      margin-bottom: 8px;
    }
    .result-great  .result-score { color: #2e7d32; }
    .result-ok     .result-score { color: #e65100; }
    .result-retry  .result-score { color: #c62828; }
    .result-msg {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--ink);
    }
    .result-sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 24px; }
    .result-mum {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--accent2);
      margin-bottom: 22px;
    }
    .reset-btn {
      background: var(--hero-bg);
      color: #fff;
      border: none;
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 0.92rem;
      padding: 12px 32px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .reset-btn:hover { background: var(--accent3); transform: translateY(-1px); }

    /* FINAL SUBMIT */
    .final-row {
      text-align: center;
      margin-top: 10px;
    }
    .final-btn {
      background: linear-gradient(135deg, var(--accent3), var(--accent2));
      color: #fff;
      border: none;
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      padding: 16px 44px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(13,71,161,0.28);
      transition: all 0.2s;
    }
    .final-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(13,71,161,0.35); }

    @media (max-width: 600px) {
      .hero { padding: 36px 16px 52px; }
      main  { padding: 22px 12px 60px; }
      .q-block { padding: 18px 16px 16px; }
      .tf-btn { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">📚 Gab Revision</a>
  <div class="nav-links">
    <a href="index.html">🏠 Home</a>
    <a href="physics-index.html">⚛️ Physics</a>
    <a href="physics-p9-1-revision.html">📖 Revision</a>
  </div>
</nav>

<header class="hero">
  <div class="floating-emojis">
    <span class="fe">🚗</span>
    <span class="fe">📏</span>
    <span class="fe">📈</span>
    <span class="fe">⏱️</span>
    <span class="fe">🏎️</span>
  </div>
  <div class="chapter-badge">Physics · P9.1 · Quick Check</div>
  <h1>Speed &amp; <span>Distance–Time</span> Graphs</h1>
  <p class="kicker">20 questions · MCQ + True/False · See how much you know!</p>
  <div class="hero-tags">
    <span class="hero-tag">⚡ 20 questions</span>
    <span class="hero-tag">🧠 10 MCQ + 10 T/F</span>
    <span class="hero-tag">🏁 Score out of 20</span>
  </div>
</header>

<div class="score-bar">
  <span class="score-label">📊 Progress</span>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <span class="score-count" id="progressCount">0 / 20 answered</span>
</div>

<main id="quizMain">
  <!-- Questions injected by JS -->
</main>

<script>
const SCORE_KEY = 'physics-p9-1-score';

const questions = [
  // ── MCQ (1–10) ──
  {
    type: 'mcq',
    text: 'What is the correct equation for calculating the speed of an object?',
    options: ['v = s + t', 'v = s × t', 'v = s ÷ t', 'v = t ÷ s'],
    answer: 2,
    feedback: 'Speed (v) = distance (s) ÷ time (t). This is the core equation for P9.1 — learn it!'
  },
  {
    type: 'mcq',
    text: 'A car travels 1000 m in 40 seconds. What is its speed?',
    options: ['40 m/s', '25 m/s', '40 000 m/s', '0.04 m/s'],
    answer: 1,
    feedback: 'v = 1000 ÷ 40 = 25 m/s. The car covers 25 metres every second.'
  },
  {
    type: 'mcq',
    text: 'On a distance–time graph, what does a completely horizontal (flat) line represent?',
    options: ['The object is accelerating', 'The object is moving at constant speed', 'The object is stationary', 'The object is decelerating'],
    answer: 2,
    feedback: 'A flat line means no change in distance over time — the object is stationary (speed = 0).'
  },
  {
    type: 'mcq',
    text: 'What does the gradient of a line on a distance–time graph represent?',
    options: ['Acceleration', 'Speed', 'Distance', 'Time'],
    answer: 1,
    feedback: 'Gradient = change in distance ÷ change in time = speed. Steeper gradient → faster speed.'
  },
  {
    type: 'mcq',
    text: 'Three lorries X, Y, and Z are plotted on the same distance–time graph. X has the steepest line, Y is shallower, and Z has a flat section. Which lorry is fastest?',
    options: ['Y', 'Z', 'X', 'They are all the same speed'],
    answer: 2,
    feedback: 'X has the steepest gradient, meaning it covers the most distance in the same amount of time — it is fastest.'
  },
  {
    type: 'mcq',
    text: 'Lorry Y travels 30 000 m in 1250 s. What is its speed?',
    options: ['24 m/s', '30 m/s', '12 m/s', '1250 m/s'],
    answer: 0,
    feedback: 'v = 30 000 ÷ 1250 = 24 m/s. Always divide distance by time.'
  },
  {
    type: 'mcq',
    text: 'A car travels at 6.0 m/s for 50 seconds. How far does it travel?',
    options: ['56 m', '8.3 m', '300 m', '0.12 m'],
    answer: 2,
    feedback: 's = v × t = 6.0 × 50 = 300 m. Rearrange the speed equation to find distance.'
  },
  {
    type: 'mcq',
    text: 'A vehicle travels at 21 m/s for 6 minutes. How far does it travel? (Remember to convert time!)',
    options: ['126 m', '7560 m', '3360 m', '21 000 m'],
    answer: 1,
    feedback: '6 minutes = 360 s. s = 21 × 360 = 7560 m. Always convert minutes to seconds first!'
  },
  {
    type: 'mcq',
    text: 'What is the scientific unit of speed?',
    options: ['Kilometres per hour (km/h)', 'Metres per second (m/s)', 'Metres per minute (m/min)', 'Centimetres per second (cm/s)'],
    answer: 1,
    feedback: 'The SI unit of speed is metres per second (m/s), also written as ms⁻¹.'
  },
  {
    type: 'mcq',
    text: 'A train takes 2 hours 40 minutes to travel 360 km. What is its average speed in m/s? (360 km = 360 000 m)',
    options: ['135 m/s', '37.5 m/s', '2.25 m/s', '37 500 m/s'],
    answer: 1,
    feedback: '2 h 40 min = 9600 s. v = 360 000 ÷ 9600 = 37.5 m/s. Convert both distance and time to correct units!'
  },
  // ── TRUE / FALSE (11–20) ──
  {
    type: 'tf',
    text: 'A straight line sloping upwards on a distance–time graph means the object is moving at constant speed.',
    answer: true,
    feedback: 'TRUE. A straight (not curved), upward-sloping line shows uniform motion — constant speed throughout.'
  },
  {
    type: 'tf',
    text: 'A steeper gradient on a distance–time graph always means the object has travelled a greater total distance.',
    answer: false,
    feedback: 'FALSE. A steeper gradient means a higher SPEED, not necessarily a greater total distance. Two objects could end at the same distance but one got there faster.'
  },
  {
    type: 'tf',
    text: 'If time is given in minutes, you must convert it to seconds before using the speed equation v = s ÷ t.',
    answer: true,
    feedback: 'TRUE. The standard unit of time in the speed equation is seconds. Always convert: 1 minute = 60 s.'
  },
  {
    type: 'tf',
    text: 'On a distance–time graph, a flat horizontal section means the object is moving at its fastest speed.',
    answer: false,
    feedback: 'FALSE. A flat horizontal section means the object is STATIONARY — speed = 0. No distance is being gained.'
  },
  {
    type: 'tf',
    text: 'The speed equation can be rearranged to give distance as: s = v × t.',
    answer: true,
    feedback: 'TRUE. From v = s ÷ t, multiply both sides by t to get s = v × t.'
  },
  {
    type: 'tf',
    text: 'Average speed is calculated using only the time when the object was actually moving (not stopped).',
    answer: false,
    feedback: 'FALSE. Average speed = total distance ÷ TOTAL time, including any periods when the object was stopped.'
  },
  {
    type: 'tf',
    text: 'A tachograph is a device fitted to long-distance vehicles to record how fast and how long the driver has been driving.',
    answer: true,
    feedback: 'TRUE. Tachographs record driving data to ensure drivers do not drive for too long — a safety measure on motorways.'
  },
  {
    type: 'tf',
    text: 'On a distance–time graph, two parallel lines (same gradient) mean the two objects are travelling at the same speed.',
    answer: true,
    feedback: 'TRUE. Parallel lines have identical gradients, which means identical speeds — even if one object started further ahead.'
  },
  {
    type: 'tf',
    text: 'Lorry Z\'s average speed over 1500 s is greater than its speed during the moving sections alone.',
    answer: false,
    feedback: 'FALSE. Because Z was stopped for part of the journey, its average speed over 1500 s is LOWER than its speed when it was actually moving.'
  },
  {
    type: 'tf',
    text: 'The speed equation v = s ÷ t can only be used when the speed is constant (uniform).',
    answer: false,
    feedback: 'FALSE. While the equation gives exact speed for constant motion, it can also be used to calculate AVERAGE speed for any journey, even if speed varied throughout.'
  }
];

let answered = 0;
const total = questions.length;

function updateProgress() {
  const pct = (answered / total) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressCount').textContent = answered + ' / ' + total + ' answered';
}

function buildQuiz() {
  const main = document.getElementById('quizMain');
  main.innerHTML = '';

  questions.forEach((q, i) => {
    const block = document.createElement('div');
    block.className = 'q-block';
    block.id = 'q' + i;

    const meta = `
      <div class="q-meta">
        <span class="q-num">Q${i + 1}</span>
        <span class="q-type">${q.type === 'mcq' ? '🔵 Multiple Choice' : '✅ True / False'}</span>
      </div>
    `;
    const qText = `<div class="q-text">${q.text}</div>`;

    let body = '';
    if (q.type === 'mcq') {
      const letters = ['A', 'B', 'C', 'D'];
      const opts = q.options.map((o, j) => `
        <button class="opt" data-qi="${i}" data-oi="${j}" onclick="selectOpt(${i}, ${j})">
          <span class="opt-letter">${letters[j]}</span>${o}
        </button>
      `).join('');
      body = `<div class="options">${opts}</div>`;
    } else {
      body = `
        <div class="tf-wrap">
          <button class="tf-btn" data-qi="${i}" data-val="true" onclick="selectTF(${i}, true)">✅ True</button>
          <button class="tf-btn" data-qi="${i}" data-val="false" onclick="selectTF(${i}, false)">❌ False</button>
        </div>
      `;
    }

    const feedback = `<div class="feedback" id="fb${i}"></div>`;
    const submitRow = `
      <div class="submit-row" id="submitRow${i}">
        <button class="check-btn" id="checkBtn${i}" onclick="checkAnswer(${i})" disabled>Check Answer</button>
      </div>
    `;

    block.innerHTML = meta + qText + body + feedback + submitRow;
    main.appendChild(block);
  });

  // Final submit
  const finalRow = document.createElement('div');
  finalRow.className = 'final-row';
  finalRow.id = 'finalRow';
  finalRow.style.display = 'none';
  finalRow.innerHTML = `<button class="final-btn" onclick="showResult()">🏁 See My Score!</button>`;
  main.appendChild(finalRow);

  // Result box
  const rb = document.createElement('div');
  rb.className = 'result-box';
  rb.id = 'resultBox';
  main.appendChild(rb);
}

// Track selections
const selections = {};

function selectOpt(qi, oi) {
  const q = questions[qi];
  if (selections[qi] !== undefined && selections[qi].locked) return;
  selections[qi] = { value: oi, locked: false };

  // Visual update
  document.querySelectorAll(`.opt[data-qi="${qi}"]`).forEach(btn => btn.classList.remove('selected'));
  const chosen = document.querySelector(`.opt[data-qi="${qi}"][data-oi="${oi}"]`);
  if (chosen) chosen.classList.add('selected');
  document.getElementById('checkBtn' + qi).disabled = false;
}

function selectTF(qi, val) {
  if (selections[qi] !== undefined && selections[qi].locked) return;
  selections[qi] = { value: val, locked: false };

  document.querySelectorAll(`.tf-btn[data-qi="${qi}"]`).forEach(btn => btn.classList.remove('selected'));
  const chosen = document.querySelector(`.tf-btn[data-qi="${qi}"][data-val="${val}"]`);
  if (chosen) chosen.classList.add('selected');
  document.getElementById('checkBtn' + qi).disabled = false;
}

function checkAnswer(qi) {
  const q = questions[qi];
  const sel = selections[qi];
  if (!sel || sel.locked) return;
  sel.locked = true;

  const block  = document.getElementById('q' + qi);
  const fb     = document.getElementById('fb' + qi);
  const btn    = document.getElementById('checkBtn' + qi);
  btn.disabled = true;

  let correct = false;
  if (q.type === 'mcq') {
    correct = (sel.value === q.answer);
    document.querySelectorAll(`.opt[data-qi="${qi}"]`).forEach(b => {
      b.disabled = true;
      const oi = parseInt(b.dataset.oi);
      if (oi === q.answer) b.classList.add('reveal-correct');
      else if (oi === sel.value && !correct) b.classList.add('reveal-wrong');
    });
  } else {
    correct = (sel.value === q.answer);
    document.querySelectorAll(`.tf-btn[data-qi="${qi}"]`).forEach(b => {
      b.disabled = true;
      const bval = b.dataset.val === 'true';
      if (bval === q.answer) b.classList.add('reveal-correct');
      else if (bval === sel.value && !correct) b.classList.add('reveal-wrong');
    });
  }

  sel.correct = correct;
  block.classList.add(correct ? 'correct' : 'wrong');
  fb.textContent = (correct ? '✅ Correct! ' : '❌ Not quite. ') + q.feedback;
  fb.className = 'feedback show ' + (correct ? 'correct-fb' : 'wrong-fb');

  answered++;
  updateProgress();

  if (answered === total) {
    document.getElementById('finalRow').style.display = 'block';
    document.getElementById('finalRow').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function showResult() {
  const score = Object.values(selections).filter(s => s.correct).length;
  localStorage.setItem(SCORE_KEY, score);

  const rb = document.getElementById('resultBox');
  document.getElementById('finalRow').style.display = 'none';

  let cls, emoji, msg, sub, mumLine;
  if (score >= 17) {
    cls = 'result-great';
    emoji = '🏆';
    msg = 'Outstanding — you nailed it!';
    sub = 'You clearly understand speed and distance–time graphs inside out.';
    mumLine = '🌟 Show this to mum — ' + score + '/20!';
  } else if (score >= 12) {
    cls = 'result-ok';
    emoji = '👍';
    msg = 'Good effort — nearly there!';
    sub = 'A few gaps to fill. Head back to the revision page and review what you missed.';
    mumLine = '📖 Show this to mum — ' + score + '/20 — keep going!';
  } else {
    cls = 'result-retry';
    emoji = '💪';
    msg = 'Keep going — you\'ve got this!';
    sub = 'Review the revision notes and try again. The equations will click — promise!';
    mumLine = '📚 Show this to mum — ' + score + '/20 — more revision needed!';
  }

  rb.className = 'result-box show ' + cls;
  rb.innerHTML = `
    <div class="result-emoji">${emoji}</div>
    <div class="result-score">${score} / 20</div>
    <div class="result-msg">${msg}</div>
    <div class="result-sub">${sub}</div>
    <div class="result-mum">${mumLine}</div>
    <button class="reset-btn" onclick="resetQuiz()">🔄 Try Again</button>
  `;
  rb.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function resetQuiz() {
  Object.keys(selections).forEach(k => delete selections[k]);
  answered = 0;
  updateProgress();
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Init
buildQuiz();
updateProgress();
</script>
</body>
</html>
